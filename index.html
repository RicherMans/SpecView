/* ---- resizable JSON panel ---------------------------------------------
   The JSON panel width is shared across every card via the --meta-width
   CSS variable (they all stay in sync). Drag the thin handle to widen /
   narrow it; double-click to restore the default. Width is remembered. */
const META_WIDTH_DEFAULT = 300;
const META_WIDTH_MIN = 180;

function metaWidthNow() {
  const v = getComputedStyle(document.documentElement).getPropertyValue('--meta-width').trim();
  return v || (META_WIDTH_DEFAULT + 'px');
}
function metaResizeStart(e) {
  if (e.button !== 0) return;
  const rz = e.currentTarget;
  const row = rz.closest('.card-row');
  if (!row) return;
  e.preventDefault();
  rz.classList.add('dragging');
  const onMove = ev => {
    const rect = row.getBoundingClientRect();
    const maxW = Math.max(META_WIDTH_MIN, rect.width - 220);  /* keep room for the audio column */
    const w = Math.max(META_WIDTH_MIN, Math.min(ev.clientX < rect.right ? (rect.right - ev.clientX) : maxW, maxW));
    document.documentElement.style.setProperty('--meta-width', w + 'px');
  };
  const onUp = () => {
    rz.classList.remove('dragging');
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    try { localStorage.setItem('specview-meta-width', metaWidthNow()); } catch (err) {}
    sizeAndRedrawLoaded();   /* reflow viewport-near spectrograms to the new width */
    refreshMetaWindow();
  };
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
}
function metaResizeReset() {
  document.documentElement.style.setProperty('--meta-width', '');
  try { localStorage.removeItem('specview-meta-width'); } catch (err) {}
  sizeAndRedrawLoaded();
  refreshMetaWindow();
}
function makeMetaResizer() {
  const rz = document.createElement('div');
  rz.className = 'meta-resizer';
  rz.title = 'Drag to resize the JSON panel · double-click to reset to default';
  rz.addEventListener('pointerdown', metaResizeStart);
  rz.addEventListener('dblclick', e => { e.stopPropagation(); metaResizeReset(); });
  return rz;
}

/* ========================================================================
 *  JSON METADATA INTERACTION — click JSON keys to multi-select fields.
 *  Field paths are JSON Pointers (RFC 6901) so keys containing '.' or markup
 *  characters work. While fields are selected every row shows those fields
 *  (highlighted); click a selected key again (or x / uncheck) to go back.
 * ======================================================================== */
let metaSelPaths = new Set();   /* JSON Pointer paths currently selected */
const META_INLINE_CAP = 220;    /* max chars of an inline value preview */

/* Global map of every loaded .json: key -> raw text (+ source path). Filled by
   buildMetaMap()/the archive reader; read by the fields browser and to render
   standalone (unpaired) JSON cards. */
const metaMap = new Map();
const metaSource = new Map();

/* ---- JSON Pointer (RFC 6901) path helpers ---- */
function encMetaSeg(seg) { return String(seg).replace(/~/g, '~0').replace(/\//g, '~1'); }
function decMetaSeg(seg) { return String(seg).replace(/~1/g, '/').replace(/~0/g, '~'); }
function joinMetaPath(prefix, seg) { return prefix + '/' + encMetaSeg(seg); }
function metaPathSegments(path) { return path ? path.split('/').slice(1).map(decMetaSeg) : []; }
function displayMetaPath(path) {
  return metaPathSegments(path).map((seg, idx) => {
    if (/^\d+$/.test(seg)) return '[' + seg + ']';
    if (/^[A-Za-z_$][\w$]*$/.test(seg)) return idx === 0 ? seg : '.' + seg;
    return '[' + JSON.stringify(seg) + ']';
  }).join('');
}

function safeJsonParse(raw) { try { return JSON.parse(raw); } catch (e) { return null; } }
function metaLooksJson(s) { const t = String(s).trim(); return (t[0] === '{' || t[0] === '[') && t.length < 200000; }
/* Unwrap a single-key root wrapper object (webdataset style {"<id>": …}) so the
   inner fields appear at the root. */
function unwrapRoot(v) {
  if (v && typeof v === 'object' && !Array.isArray(v)) {
    const ks = Object.keys(v);
    if (ks.length === 1 && v[ks[0]] !== null && typeof v[ks[0]] === 'object' && !Array.isArray(v[ks[0]])) return v[ks[0]];
  }
  return v;
}

function jsonScalarCls(v) {
  if (typeof v === 'number') return 'num';
  if (typeof v === 'boolean') return 'bool';
  if (v === null) return 'null';
  return 'str';
}
function jsonScalarHtml(v) {
  if (v === null) return '<span class="jv-null">null</span>';
  if (Array.isArray(v)) return '<span class="jv-punc">' + escMetaText(JSON.stringify(v)) + '</span>';
  if (typeof v === 'object') return '<span class="jv-punc">{…}</span>';
  if (typeof v === 'string') return '<span class="jv-str">' + escMetaText(v.length > META_INLINE_CAP ? v.slice(0, META_INLINE_CAP) + '…' : v) + '</span>';
  return '<span class="jv-' + jsonScalarCls(v) + '">' + escMetaText(String(v)) + '</span>';
}
function metaLineHtml(depth, content) {
  return '<div class="json-line" style="padding-left:' + (depth * 14) + 'px">' + content + '</div>';
}

/* Render a JSON value as a clickable tree using JSON-Pointer paths. Nested
   objects recurse; JSON encoded in strings (e.g. ACAV "caption") is expanded. */
function renderTreeInto(v, depth, out, prefix) {
  if (out.length >= META_TREE_MAX_LINES) return;
  if (v === null || typeof v !== 'object') {
    out.push(metaLineHtml(depth, '<span class="jv-' + jsonScalarCls(v) + '">' + escMetaText(String(v)) + '</span>'));
    return;
  }
  if (Array.isArray(v)) {
    if (v.length === 0) { out.push(metaLineHtml(depth, '<span class="jv-punc">[]</span>')); return; }
    for (let i = 0; i < v.length; i++) {
      const p = joinMetaPath(prefix, String(i));
      out.push(metaLineHtml(depth, '<span class="jv-punc">' + i + ':</span>'));
      renderTreeInto(v[i], depth + 1, out, p);
    }
    return;
  }
  const keys = Object.keys(v);

  };

  const byPath = new Map([['', root]]);

    const hit = byPath.get(path);

    const last = decMetaSeg(path.slice(slash + 1));
    const parent = ensure(slash > 0 ? path.slice(0, slash) : '');
    const node = { name: /^\d+$/.test(last) ? '[' + last + ']' : last, path, count: 0, children: [], leaves: [] };

    if (n.children.length === 0) { n.leaves = n.path ? [n.path] : []; return; }
    n.leaves = [];
    n.children.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }));

/* ---- standalone (unpaired) JSON cards ---- */
const jsonCards = [];   /* { key, filePath, name, card, panel } */
/* Bound DOM growth for archives containing many orphan .json files. */
const JSON_CARD_CAP = 300;

/** Both key variants (dir-qualified and bare-name) of every live/pending audio

function collectPairedMetaKeys() {
  const paired = new Set();
  const add = (name, filePath) => { paired.add(metaKeyOf(name, filePath)); paired.add(metaKeyOf(name)); };
  for (const t of tracks) add(t.name, t.filePath);
  for (const grp of pendingCards) for (const it of (grp.items || [])) add(it.name, it.filePath);
  return paired;

/** Reconcile standalone JSON cards with the current tracks + metaMap. */
function ensureStandaloneJsonCards() {
  const paired = collectPairedMetaKeys();
  for (let i = jsonCards.length - 1; i >= 0; i--) {
    const c = jsonCards[i];
    if (!metaMap.has(c.key) || paired.has(c.key)) { if (c.card) c.card.remove(); jsonCards.splice(i, 1); }
  }
  const have = new Set(jsonCards.map(c => c.key));
  for (const [key, text] of metaMap) {
    if (have.has(key) || paired.has(key)) continue;
    if (jsonCards.length >= JSON_CARD_CAP) break;
    const filePath = metaSource.get(key) || undefined;
    const base = filePath ? filePath.replace(/\\/g, '/').split('/').pop() || key : key;
    const card = document.createElement('div');
    card.className = 'card json-card';
    const hdr = document.createElement('div');

    hdr.innerHTML = '<span class="card-title" title="' + escAttr(base) + '">' + escMetaText(base) + '</span>' +
      '<button class="card-remove" title="Remove">&times;</button>';
    hdr.querySelector('.card-remove').addEventListener('click', e => { e.stopPropagation(); removeJsonCard(key); });
    card.appendChild(hdr);
    const panel = buildMetaPanel();
    panel.aside.classList.add('show');
    card.appendChild(panel.aside);

/* ---- viewport-scoped panel refresh ---- */
function metaPanelsMarkStale() {

  for (const g of groups) if (g.metaPanel && g.metaPanel.body) g.metaPanel.body._metaLast = null;

        if (!t.loaded) continue;

/* Reflow already-decoded canvases after the meta panel changes layout width */
function ensureTrackCanvasWidth(t) {
  if (!t.loaded) return;
  if (isMultiTrack(t)) {
    for (let i = 0; i < t.chViews.length; i++) {
      const ch = t.chViews[i];
      const w = ch.wrapper ? ch.wrapper.clientWidth : 0;
      if (w <= 0 || !ch.canvas || w === ch.canvas.width) continue;
      ch.canvas.width = w;
      if (ch.canvas._h) ch.canvas.height = ch.canvas._h;
      if (ch.waveformCanvas) { ch.waveformCanvas.width = w; if (ch.waveformCanvas._h) ch.waveformCanvas.height = ch.waveformCanvas._h; }
      if (ch.specData) { drawSpec(t, i); if (waveformVisible && ch.waveformCanvas) drawWaveform(t, i); }
    }
    return;
  }
  if (!t.wrapper || !t.canvas) return;
  const w = t.wrapper.clientWidth;
  if (w > 0 && t.canvas.width !== w) {
    t.canvas.width = w;
    if (t.canvas._h) t.canvas.height = t.canvas._h;
    if (t.waveformCanvas) {
      t.waveformCanvas.width = w;
      if (t.waveformCanvas._h) t.waveformCanvas.height = t.waveformCanvas._h;
    }
    if (t.specData) {
      drawSpec(t);

  for (const s of sibs) s.offset = Math.max(0, Math.min(time, s.duration));
  updatePlayheads(); updateTimeDisplay();
  if (was) { playSource(track, track.offset); startAnim(); }
}

function getSiblings(t) {
  if (t.groupId == null) return [t];
  const g = groups.find(g => g.id === t.groupId);
  if (!g) return [t];
  return g.trackIds.map(id => tracks.find(tr => tr.id === id)).filter(Boolean);
}

/* ========================================================================
 *  STANDALONE TRACK
 * ======================================================================== */
function createStandalone(name, buffer, nativeSR, file, filePath, meta) {
  const t = mkTrack(name, buffer, nativeSR, file, filePath, meta);
  const infoText = t.loaded
    ? (function(){ const b=buffer; const ch=b.numberOfChannels===1?'Mono':b.numberOfChannels===2?'Stereo':b.numberOfChannels+'ch'; return ch+' '+(t.sr/1000).toFixed(1)+'kHz | '+fmt(t.duration); })()
    : '…';
  const card = document.createElement('div');
  card.className = 'card'; card.dataset.trackId = t.id;
  const hdr = document.createElement('div');
  hdr.className = 'card-header';
  hdr.innerHTML =
    '<span class="card-title" title="'+esc(name)+'">'+esc(name)+'</span>'+
    '<button class="btn-analyze" title="Run audio classification">Analyze</button>'+
    '<span class="card-info">'+esc(infoText)+'</span>'+
    '<button class="card-remove" title="Remove">&times;</button>';
  hdr.addEventListener('click', () => setActive(t.id));
  hdr.querySelector('.card-remove').addEventListener('click', e => { e.stopPropagation(); removeTrack(t.id); });
  hdr.querySelector('.btn-analyze').addEventListener('click', e => { e.stopPropagation(); runAnalysis(t); });
  t.analyzeBtn = hdr.querySelector('.btn-analyze');
  card.appendChild(hdr);

  const bodyEl = buildSpecBody(t, SPEC_H);

  const leftCol = document.createElement('div');
  leftCol.className = 'card-left';
  leftCol.appendChild(bodyEl);
  leftCol.appendChild(rulerEl);
  const panel = buildMetaPanel();
  setMetaBody(panel.body, t.meta);
  t.metaPanel = panel;
  const row = document.createElement('div');
  row.className = 'card-row';
  row.appendChild(leftCol);
  row.appendChild(makeMetaResizer());
  row.appendChild(panel.aside);
  card.appendChild(row);

  tracksBox.appendChild(card);
  t.el = card;
  tracks.push(t);
  if (!activeTrackId) activeTrackId = t.id;

  if (t.loaded) {
    /* render after DOM insertion so wrapper has measured width */
    requestAnimationFrame(() => { if (t._pendingRender) { t._pendingRender(); t._pendingRender = null; } });
  } else {
    /* lazy: observe for viewport intersection */
    lazyObserver.observe(card);
  }
  scheduleGeometry();
  return card;
}

function removeTrack(id) {
  const i = tracks.findIndex(t => t.id===id);
  if (i<0) return;
  const t = tracks[i];
  if (t.playing) stopSource(t);
  if (t.groupId != null) { removeDiffGroup(t.groupId); return; }
  unwatchPaint(t);
  if (t.el) t.el.remove();
  tracks.splice(i,1);
  if (activeTrackId===id) activeTrackId = tracks.length ? tracks[0].id : null;
  refreshUI();
}

/* ========================================================================
 *  DIFF GROUP
 * ======================================================================== */
function createDiffGroup(baseName, items) {
  const gid = nextGrpId++;
  const grpTracks = [];
  const anyLoaded = items.some(i => !!i.buffer);
  const maxDur = anyLoaded ? Math.max(...items.filter(i=>i.buffer).map(i => i.buffer.duration)) : 0;
  const card = document.createElement('div');
  card.className = 'card'; card.dataset.groupId = gid;

  const hdr = document.createElement('div');
  hdr.className = 'card-header';
  const display = baseName || items[0].name;
  hdr.innerHTML =
    '<span class="card-title" title="'+esc(display)+'">'+esc(display)+'</span>'+
    '<span class="diff-badge">DIFF '+items.length+'</span>'+
    '<button class="btn-analyze-group" title="Analyze all tracks in this group">Analyze Group</button>'+
    '<span class="card-info">'+(anyLoaded ? fmt(maxDur) : '…')+'</span>'+
    '<button class="card-remove" title="Remove group">&times;</button>';
  hdr.addEventListener('click', () => { if(grpTracks.length) setActive(grpTracks[0].id); });
  hdr.querySelector('.card-remove').addEventListener('click', e => { e.stopPropagation(); removeDiffGroup(gid); });
  hdr.querySelector('.btn-analyze-group').addEventListener('click', e => { e.stopPropagation(); runAnalysisGroup(tracks, gid); });
  card.appendChild(hdr);

  const cols = document.createElement('div');
  cols.className = 'diff-columns';

  items.forEach((item, idx) => {
    const t = mkTrack(item.name, item.buffer, item.nativeSR, item.file, item.filePath, item.meta);
    t.groupId = gid;
    const lane = document.createElement('div');
    lane.className = 'diff-lane';

    const lbl = document.createElement('div');
    lbl.className = 'diff-lane-label';
    const tagText = item.suffix ? item.suffix : (item.filePath ? getParentFolderName(item.filePath) || ('Track '+(idx+1)) : ('Track '+(idx+1)));
    const tagCls  = TAG_CSS[idx % TAG_CSS.length];
    const srText  = t.loaded ? (t.sr/1000).toFixed(1)+'kHz' : '…';
    lbl.innerHTML =
      '<span class="diff-lane-tag '+tagCls+'">'+esc(tagText)+'</span>'+
      '<span class="diff-lane-name">'+esc(item.name)+'</span>'+
      '<button class="btn-analyze" title="Run audio classification">Analyze</button>'+
      '<span class="card-info">'+esc(srText)+'</span>'+
      '<span class="diff-lane-playing"></span>'+
      '<button class="lane-remove" title="Remove this track">&times;</button>';
    lbl.addEventListener('click', () => { setActive(t.id); updateLaneHighlights(); });
    lbl.querySelector('.btn-analyze').addEventListener('click', e => { e.stopPropagation(); runAnalysis(t); });
    lbl.querySelector('.lane-remove').addEventListener('click', e => { e.stopPropagation(); deleteTrackFromGroup(t.id); });
    t.analyzeBtn = lbl.querySelector('.btn-analyze');
    lane.appendChild(lbl);
    t.laneLabel = lbl;

    lane.appendChild(buildSpecBody(t, SPEC_H_DIFF));
    cols.appendChild(lane);

    t.el = card;
    tracks.push(t);
    grpTracks.push(t);
    if (!activeTrackId) activeTrackId = t.id;
  });

  const rulerTrack = grpTracks[0];
  const rulerEl = buildRuler(rulerTrack);
  for (const gt of grpTracks) gt.rulerEl = rulerEl;

  /* body row: diff columns (left) + active-lane JSON metadata (right) */
  const leftCol = document.createElement('div');
  leftCol.className = 'card-left';
  leftCol.appendChild(cols);
  leftCol.appendChild(rulerEl);
  const panel = buildMetaPanel();
  const row = document.createElement('div');
  row.className = 'card-row';
  row.appendChild(leftCol);
  row.appendChild(makeMetaResizer());
  row.appendChild(panel.aside);
  card.appendChild(row);

  tracksBox.appendChild(card);
  groups.push({ id: gid, baseName, trackIds: grpTracks.map(t => t.id), el: card, metaPanel: panel });
  updateLaneHighlights();
  refreshMetaPanels();

  if (grpTracks.some(t => t.loaded)) {
    /* render loaded lanes after DOM insertion so wrappers have measured width */
    requestAnimationFrame(() => {
      for (const t of grpTracks) {
        if (t._pendingRender) { t._pendingRender(); t._pendingRender = null; }
      }
    });
  }
  if (grpTracks.some(t => !t.loaded)) {
    /* lazy: observe for viewport intersection */
    lazyObserver.observe(card);
  }
  scheduleGeometry();
  return card;
}

function removeDiffGroup(gid) {
  const gi = groups.findIndex(g => g.id===gid);
  if (gi<0) return;
  const grp = groups[gi];
  for (const tid of grp.trackIds) {
    const ti = tracks.findIndex(t => t.id===tid);
    if (ti>=0) {
      if(tracks[ti].playing) stopSource(tracks[ti]);
      unwatchPaint(tracks[ti]);
      tracks.splice(ti,1);
    }
  }
  grp.el.remove(); groups.splice(gi,1);
  if (activeTrackId && !tracks.find(t => t.id===activeTrackId))
    activeTrackId = tracks.length ? tracks[0].id : null;
  refreshUI();
}

function deleteTrackFromGroup(trackId) {
  const t = tracks.find(tr => tr.id === trackId);
  if (!t) return;
  if (t.playing) stopSource(t);
  if (t.groupId == null) { removeTrack(t.id); return; }
  const g = groups.find(gr => gr.id === t.groupId);
  if (!g) { removeTrack(t.id); return; }
  const ph = insertPlaceholderBefore(g.el);
  if (g.trackIds.length <= 2) {
    const remainingId = g.trackIds.find(id => id !== t.id);
    const remaining = tracks.find(tr => tr.id === remainingId);
    if (remaining) {
      const { name, buffer, nativeSR, file, filePath, meta } = remaining;
      if (remaining.playing) stopSource(remaining);
      removeDiffGroupQuietly(g.id);
      createStandalone(name, buffer, nativeSR, file, filePath, meta);
    } else { removeDiffGroupQuietly(g.id); }
  } else {
    const baseName = g.baseName;
    const remainingItems = g.trackIds.filter(id => id !== t.id).map(id => {
      const tr = tracks.find(x => x.id === id);
      if (!tr) return null;
      const tag = extractTag(stripExt(tr.name)).tag;
      const suffix = tag || (tr.filePath ? getParentFolderName(tr.filePath) : tr.name);
      return { name: tr.name, buffer: tr.buffer, file: tr.file, suffix, nativeSR: tr.nativeSR, filePath: tr.filePath, meta: tr.meta || null };
    }).filter(Boolean);
    removeDiffGroupQuietly(g.id);
    if (remainingItems.length >= 2) createDiffGroup(baseName, remainingItems);
    else if (remainingItems.length === 1) { const it = remainingItems[0]; createStandalone(it.name, it.buffer, it.nativeSR, it.file, it.filePath, it.meta); }
  }
  const newCard = tracksBox.lastElementChild;
  if (newCard && newCard !== ph && ph.parentNode) tracksBox.insertBefore(newCard, ph);
  ph.remove();
  refreshUI();
}
function deleteActiveTrack() { const t = getActive(); if (t) deleteTrackFromGroup(t.id); }

function updateLaneHighlights() {
  for (const t of tracks) {
    if (!t.laneLabel) continue;
    const sel = t.id === activeTrackId;
    t.laneLabel.classList.toggle('selected', sel);
    const badge = t.laneLabel.querySelector('.diff-lane-playing');
    if (badge) badge.textContent = sel ? 'ACTIVE' : '';
  }
}

/* ========================================================================
 *  FREQUENCY LABELS  (linear scale, matching spectrogram rendering)
 *  Dynamically culls labels that would overlap vertically.
 * ======================================================================== */
function addFreqLabels(el, ny) {
  if (!ny || ny <= 0) return;  /* skip for unloaded tracks */
  const allTicks = [200,500,1000,2000,4000,8000,12000,16000,20000,24000];
  const h = parseInt(el.style.height) || 220;
  const MIN_GAP = 14; /* minimum px between label centers */

  /* Always include a label for the Nyquist frequency at the top */
  const candidates = [];
  const nyText = ny >= 1000 ? (ny/1000).toFixed(ny%1000?1:0)+'k' : ny+'';
  candidates.push({ f: ny, px: 5, text: nyText, priority: true });

  /* Compute pixel positions for all candidate ticks (linear scale) */
  for (const f of allTicks) {
    if (f >= ny || f <= 0) continue;  /* skip if at or above nyquist (already added) */
    const frac = f / ny;
    const px   = (1 - frac) * h;
    const text = f >= 1000 ? (f/1000).toFixed(f%1000?1:0)+'k' : f+'';
    candidates.push({ f, px, text });
  }

  /* Greedily select labels that don't overlap.
     Start with Nyquist (top, px=0), then add lower freqs bottom-up. */
  /* Separate priority (Nyquist) from the rest */
  const nyLabel = candidates.find(c => c.priority);
  const rest = candidates.filter(c => !c.priority);
  rest.sort((a,b) => b.px - a.px); /* bottom-up */

  const selected = [];
  if (nyLabel) { selected.push(nyLabel); }
  let lastPx = nyLabel ? nyLabel.px : -Infinity;
  /* Also track bottom boundary */
  for (const c of rest) {
    if (c.px < h - 6 && c.px > 6 && Math.abs(c.px - lastPx) >= MIN_GAP) {
      selected.push(c);
      lastPx = c.px;
    }
  }

  /* Render ticks + labels */
  for (const c of selected) {
    const pct = (c.px / h * 100) + '%';
    /* tick mark */
    const tick = document.createElement('span');
    tick.className = 'freq-tick';
    tick.style.top = pct;
    el.appendChild(tick);
    /* label */
    const lbl = document.createElement('span');
    lbl.className = 'freq-label';
    lbl.style.top = pct;
    lbl.textContent = c.text;
    el.appendChild(lbl);
  }
}

/* ========================================================================
 *  UI

function clearAll() {

/* ========================================================================
 *  AUTO-GROUPING TOGGLE
 *  Partitioning helper + in-place regroup (on) / split (off), chunked so many
 *  cards don't block the UI.
 * ======================================================================== */
function groupItems(items) {
  return autoGroup ? groupByBaseName(items) : items.map(it => ({ baseName: it.name, items: [it] }));
}

function updateGroupingUI() {
  if (!btnGrouping) return;
  btnGrouping.disabled = tracks.length === 0 || groupingBusy;
  btnGrouping.textContent = groupingBusy ? 'Working…' : (autoGroup ? 'Grouping: On' : 'Grouping: Off');
  btnGrouping.classList.toggle('active', autoGroup);
}

/* Drop windowed descriptors whose card is no longer in the DOM. */
function pruneRenderedCards() {
  renderedCards = renderedCards.filter(d => d._el && d._el.isConnected);
}

/* off → on: rejoin visible standalone cards into diff groups in place. */
function rebuildAll() {
  const standalones = tracks.filter(t => t.groupId == null && t.buffer && !t.isMulti);
  if (!standalones.length) { groupingBusy = false; updateGroupingUI(); return; }
  const items = standalones.map(t => ({ name: t.name, buffer: t.buffer, nativeSR: t.nativeSR, file: t.file, filePath: t.filePath, meta: t.meta }));
  const plans = [];
  for (const g of groupByBaseName(items)) {
    if (g.items.length < 2) continue;
    const trs = [];
    let ok = true;
    for (const it of g.items) {
      const t = standalones.find(s => s.name === it.name && (s.filePath || null) === (it.filePath || null));
      if (!t || !t.el) { ok = false; break; }
      trs.push(t);
    }
    if (ok) plans.push({ stem: g.baseName, items: g.items, tracks: trs });
  }
  if (!plans.length) { groupingBusy = false; updateGroupingUI(); return; }
  groupingBusy = true; updateGroupingUI();
  let idx = 0;
  const step = () => {
    if (!groupingBusy) return;
    try {
      let done = 0;
      while (idx < plans.length && done < 4) {
        const p = plans[idx++]; done++;
        const anchor = insertPlaceholderBefore(p.tracks[0].el);
        for (const t of p.tracks) removeTrackQuietly(t.id);
        pruneRenderedCards();
        const el = createDiffGroup(p.stem, p.items);
        placeCardAtPosition(anchor);
        if (el) renderedCards.push({ baseName: p.stem, items: p.items, _el: el });
      }
    } catch (e) { console.error('rebuildAll error:', e); }
    if (idx < plans.length) { setTimeout(step, 0); return; }
    groupingBusy = false; updateGroupingUI(); refreshUI(); updateSentinels();
  };
  setTimeout(step, 0);
}

/* on → off: split every diff group into standalone cards in place. */
function splitAllGroups() {
  if (!groups.length) { groupingBusy = false; updateGroupingUI(); return; }
  groupingBusy = true; updateGroupingUI();
  const gs = groups.slice();
  let idx = 0;
  const step = () => {
    if (!groupingBusy) return;
    try {
      let done = 0;
      while (idx < gs.length && done < 4) {
        const grp = gs[idx++]; done++;
        if (!groups.some(g => g.id === grp.id)) continue;
        const members = grp.trackIds.map(id => tracks.find(t => t.id === id)).filter(Boolean)
          .map(t => ({ name: t.name, buffer: t.buffer || null, nativeSR: t.nativeSR, file: t.file, filePath: t.filePath, meta: t.meta || null }));
        const ph = insertPlaceholderBefore(grp.el);
        removeDiffGroupQuietly(grp.id);
        pruneRenderedCards();
        for (const it of members) {
          const el = createStandalone(it.name, it.buffer, it.nativeSR, it.file, it.filePath, it.meta);
          if (el && ph.parentNode) tracksBox.insertBefore(el, ph);
          if (el) renderedCards.push({ baseName: it.name, items: [it], _el: el });
        }
        ph.remove();
      }
    } catch (e) { console.error('splitAllGroups error:', e); }
    if (idx < gs.length) { setTimeout(step, 0); return; }
    groupingBusy = false; updateGroupingUI(); refreshUI(); updateSentinels();
  };
  setTimeout(step, 0);
}

function toggleAutoGroup() {
  if (groupingBusy) return;
  autoGroup = !autoGroup;
  updateGroupingUI();
  if (autoGroup) rebuildAll(); else splitAllGroups();
}

function moveToNextCard() {
  const cards = Array.from(tracksBox.children).filter(c => c.className !== 'scroll-sentinel');

}
function moveToPrevCard() {

  const idx = cards.indexOf(active.el);

/* ========================================================================
 *  PLAYBACK
 * ======================================================================== */
/* Per-source routing nodes created for a per-channel mute play, so stopSource
   can disconnect them and prevent leaks. */
const activeRoutes = new WeakMap();   /* AudioBufferSourceNode -> { split, gains } */
function teardownRoute(src) {
  const route = activeRoutes.get(src);
  if (!route) return;
  activeRoutes.delete(src);
  try { src.disconnect(); } catch (e) {}
  try { route.split.disconnect(); } catch (e) {}
  for (const g of route.gains) { try { g.disconnect(); } catch (e) {} }
}
/* Per-channel gain (0/1) from mute state. Returns null for mono (direct is
   fine). 2+ channels always go through a splitter/mixer so all channels sum
   into the mix. */
function channelGains(t) {
  const n = t.buffer.numberOfChannels;
  if (n <= 1) return null;
  const g = [];
  for (let c = 0; c < n; c++) g.push(t.mutedCh.has(c) ? 0 : 1);
  return g;
}

function playSource(t, from) {
  if (!t.buffer) return;    /* not yet decoded */
  if (t.playing) stopSource(t);
  t.offset=from; t.startTime=audioCtx.currentTime;
  const src=audioCtx.createBufferSource();
  src.buffer=t.buffer;
  const gains = channelGains(t);
  if (gains) {
    const n = t.buffer.numberOfChannels;
    const split = audioCtx.createChannelSplitter(n);
    const chGains = [];
    for (let c = 0; c < n; c++) {
      const g = audioCtx.createGain();
      g.gain.value = gains[c];
      split.connect(g, c);
      g.connect(gainNode);
      chGains.push(g);
    }
    src.connect(split);
    activeRoutes.set(src, { split, gains: chGains });
  } else {
    src.connect(gainNode);
  }
  src.start(0,from);
  t.source=src; t.playing=true;
  src.onended = () => {
    if(t.source===src){ teardownRoute(src); t.offset=t.duration; t.playing=false; t.source=null;
      updateTimeDisplay(); if(!tracks.some(tr=>tr.playing)) updatePlayBtn(false); }
  };
}
function stopSource(t) {
  if(!t.playing) return;
  t.offset=Math.min(t.offset+audioCtx.currentTime-t.startTime,t.duration);
  if (t.source) teardownRoute(t.source);
  try{t.source.stop();}catch(e){} t.source=null; t.playing=false;
}
/* Rebuild the audio route when mute state changed during playback. */
function applyChannelListen(t) {
  if (!t.buffer || t.buffer.numberOfChannels <= 1) return;
  if (t.playing) {
    const pos = Math.min(t.offset + audioCtx.currentTime - t.startTime, t.duration);
    playSource(t, pos);
  }
}
async function playActive() {
  const t=getActive(); if(!t) return;
  /* Auto-load lazy track before playing */
  if (!t.buffer) {
    await loadTrack(t);
    if (!t.buffer) return;   /* decode failed */
    updateCardInfo(t.el);
    refreshUI();
  }
  audioCtx.resume(); stopAllSources();
  if(t.offset>=t.duration-0.01) t.offset=0;
  playSource(t,t.offset); startAnim();
}
function stopAllSources() { tracks.forEach(stopSource); cancelAnimationFrame(rafId); rafId=null; updatePlayBtn(false); }
function stopAll() { stopAllSources(); tracks.forEach(t=>{t.offset=0;}); updatePlayheads(); updateTimeDisplay(); updatePlayBtn(false); }
function pauseAll() {
  tracks.forEach(t => { if(t.playing) stopSource(t); });
  if(rafId){ cancelAnimationFrame(rafId); rafId=null; }
  updatePlayBtn(false); updatePlayheads(); updateTimeDisplay();
}
document.addEventListener('visibilitychange', () => { if(document.hidden) pauseAll(); });

function togglePlay() {
  if(!tracks.length) return;
  const t=getActive(); if(!t) return;
  if(t.playing){ stopSource(t); cancelAnimationFrame(rafId); rafId=null; updatePlayBtn(false); updatePlayheads(); updateTimeDisplay(); }
  else playActive();
}

/* Switch active lane within the current diff group (for A/B comparison) */
async function switchLane() {
  const t = getActive(); if (!t || t.groupId == null) return;
  const g = groups.find(g => g.id === t.groupId);
  if (!g || g.trackIds.length < 2) return;

  const idx = g.trackIds.indexOf(t.id);
  const nextIdx = (idx + 1) % g.trackIds.length;
  const nextTrack = tracks.find(tr => tr.id === g.trackIds[nextIdx]);
  if (!nextTrack) return;

  /* Auto-load lazy track before switching */
  if (!nextTrack.buffer) {
    await loadTrack(nextTrack);
    if (!nextTrack.buffer) return;
    updateCardInfo(nextTrack.el);
  }

  /* Capture current position */
  const pos = getPos(t);

  if (t.playing) stopSource(t);

  /* Sync position to all siblings */
  const sibs = getSiblings(nextTrack);
  for (const s of sibs) s.offset = Math.max(0, Math.min(pos, s.duration));

  setActive(nextTrack.id);

  /* Always play the new lane */
  audioCtx.resume();
  playSource(nextTrack, nextTrack.offset);
  startAnim();
}

function seek(time) {
  const t=getActive(); if(!t) return;
  time=Math.max(0,Math.min(time,t.duration));
  const was=t.playing;
  const sibs=getSiblings(t);
  for(const s of sibs){ if(s.playing) stopSource(s); s.offset=Math.max(0,Math.min(time,s.duration)); }
  if(was){ playSource(t,t.offset); startAnim(); }
  updatePlayheads(); updateTimeDisplay();
}

function getActive() { return activeTrackId ? tracks.find(t=>t.id===activeTrackId) : tracks[0]; }

/* ========================================================================
 *  ANIMATION
 * ======================================================================== */
function startAnim() {
  cancelAnimationFrame(rafId); updatePlayBtn(true);
  (function tick(){ updatePlayheads(); updateTimeDisplay();
    if(tracks.some(t=>t.playing)) rafId=requestAnimationFrame(tick);
    else{ rafId=null; updatePlayBtn(false); }
  })();
}
function getPos(t) { return t.playing ? Math.min(t.offset+audioCtx.currentTime-t.startTime,t.duration) : t.offset; }

function updatePlayheads() {
  /* Read phase: gather positions and widths for every loaded track first so the
     frame does at most ONE layout flush, then write all styles — avoids the
     per-lane read/write/read thrash during playback. */
  const jobs = [];
  for (const t of tracks) {
    if (!t.loaded) continue;
    const pos = getPos(t);
    const span = t.viewEnd - t.viewStart;
    const visible = !(pos < t.viewStart || pos > t.viewEnd);
    if (isMultiTrack(t)) {
      for (const ch of t.chViews) {
        if (!ch.canvas || !ch.ph) continue;
        if (!visible) { jobs.push({ ph: ch.ph, wf: ch.waveformPh, hide: true }); continue; }
        const frac = (pos - t.viewStart) / span;
        const px = frac * ch.wrapper.clientWidth;
        const wfPx = ch.waveformPh ? frac * (ch.waveformWrapper ? ch.waveformWrapper.clientWidth : px) : 0;
        jobs.push({ ph: ch.ph, wf: ch.waveformPh, hide: false, px, wfPx });
      }
      continue;
    }
    if (!t.canvas || !t.ph) continue;
    if (!visible) { jobs.push({ ph: t.ph, wf: t.waveformPh, hide: true }); continue; }
    const frac = (pos - t.viewStart) / span;
    const px = frac * t.wrapper.clientWidth;
    const wfPx = t.waveformPh ? frac * (t.waveformWrapper ? t.waveformWrapper.clientWidth : t.wrapper.clientWidth) : 0;
    jobs.push({ ph: t.ph, wf: t.waveformPh, hide: false, px, wfPx });
  }
  for (const j of jobs) {
    if (j.hide) {
      if (j.ph.style.display !== 'none') { j.ph.style.display = 'none'; j.ph._phX = undefined; }
      if (j.wf && j.wf.style.display !== 'none') { j.wf.style.display = 'none'; j.wf._phX = undefined; }
      continue;
    }
    if (j.ph.style.display === 'none') j.ph.style.display = '';
    if (j.wf && j.wf.style.display === 'none') j.wf.style.display = '';
    if (j.ph._phX !== j.px) { j.ph._phX = j.px; j.ph.style.transform = 'translateX(' + j.px + 'px)'; }
    if (j.wf && j.wf._phX !== j.wfPx) { j.wf._phX = j.wfPx; j.wf.style.transform = 'translateX(' + j.wfPx + 'px)'; }
  }
}

function updateTimeDisplay() { const t=getActive(); timeDisp.textContent=t?fmt(getPos(t))+' / '+fmt(t.duration):'0:00.000 / 0:00.000'; }
function updatePlayBtn(p){ document.body.classList.toggle('playback', !!p); playIcon.innerHTML=p?'&#10074;&#10074;':'&#9654;'; playLabel.textContent=p?'Pause':'Play'; }

 * ======================================================================== */
function fmt(s){ if(!isFinite(s)||s<0) s=0; const m=Math.floor(s/60),sc=s%60; return m+':'+(sc<10?'0':'')+sc.toFixed(3); }
function fmtShort(s){ if(!isFinite(s)||s<0) s=0; const m=Math.floor(s/60),sc=s%60; return m>0?m+':'+(sc<10?'0':'')+sc.toFixed(1):sc.toFixed(1)+'s'; }
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

let cedSession = null;
let cedLoading = false;
let cedLoadCallbacks = [];
let cedProgressEl = null; /* updated by runAnalysis to show download progress */

/* Detect likely-China user via timezone for CDN selection */
function isLikelyChina() {
  try { return Intl.DateTimeFormat().resolvedOptions().timeZone === 'Asia/Shanghai'; } catch(e) { return false; }
}

/* Configure ONNX Runtime WASM paths — use npmmirror in China. Idempotent. */
let ortConfigured = false;
function configureOrt() {
  if (ortConfigured || typeof ort === 'undefined') return;
  ortConfigured = true;
  const wasmBase = isLikelyChina()
    ? 'https://registry.npmmirror.com/onnxruntime-web/1.21.0/files/dist/'
    : 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.21.0/dist/';
  ort.env.wasm.wasmPaths = wasmBase;
  ort.env.wasm.numThreads = 1; /* avoid crossOriginIsolated requirement */
}

/* Load the ONNX Runtime script on demand (first Analyze) instead of at page
   load, so the ~1MB CDN script never blocks first paint for playback-only use. */
const ORT_SCRIPT_URL = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.21.0/dist/ort.min.js';
let ortLoadPromise = null;
function ensureOrt() {
  if (typeof ort !== 'undefined') { configureOrt(); return Promise.resolve(); }
  if (ortLoadPromise) return ortLoadPromise;
  ortLoadPromise = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = ORT_SCRIPT_URL;
    s.async = true;
    s.onload = () => { configureOrt(); resolve(); };
    s.onerror = () => { ortLoadPromise = null; reject(new Error('Failed to load ONNX Runtime')); };
    document.head.appendChild(s);
  });
  return ortLoadPromise;
}

async function loadCedModel() {
  await ensureOrt();
  if (cedSession) return cedSession;
  if (cedLoading) {
    return new Promise(resolve => cedLoadCallbacks.push(resolve));
  }
  cedLoading = true;
  try {
    /* Race all mirrors — first successful response wins.
       This auto-picks the fastest mirror (handles China/global transparently). */
    const modelData = await raceFetch(
      CED_MIRRORS.map(m => m + CED_MODEL_PATH),
      (loaded, total) => {
        if (cedProgressEl) {
          const mb = (loaded / 1048576).toFixed(1);
          const tmb = total > loaded ? (total / 1048576).toFixed(1) : '?';
          cedProgressEl.innerHTML = '<div class="spinner" style="display:inline-block;vertical-align:middle;margin-right:6px"></div>Downloading model... ' + mb + ' / ' + tmb + ' MB';
        }
      }
    );
    if (cedProgressEl) {
      cedProgressEl.innerHTML = '<div class="spinner" style="display:inline-block;vertical-align:middle;margin-right:6px"></div>Initializing WASM runtime...';
    }
    /* Yield so the status text paints before the blocking create() call */
    await new Promise(r => setTimeout(r, 0));
    const modelBytes = new Uint8Array(modelData);
    console.log('Model downloaded:', modelBytes.length, 'bytes');
    cedSession = await ort.InferenceSession.create(modelBytes.buffer, {
      executionProviders: ['wasm'],
    });
    cedLoading = false;
    for (const cb of cedLoadCallbacks) cb(cedSession);
    cedLoadCallbacks = [];
    return cedSession;
  } catch(e) {
    cedLoading = false;
    cedLoadCallbacks = [];
    throw e;
  }
}

/* Fetch from multiple URLs in parallel, return the first successful ArrayBuffer.
   Calls onProgress(loaded, total) on the leading download. */
function raceFetch(urls, onProgress) {
  return new Promise((resolve, reject) => {
    let settled = false;
    let failures = 0;
    const controllers = urls.map(() => new AbortController());

    urls.forEach((url, i) => {
      fetch(url, { signal: controllers[i].signal })
        .then(resp => {
          if (!resp.ok) throw new Error('HTTP ' + resp.status);
          const total = parseInt(resp.headers.get('content-length') || '0', 10);
          const reader = resp.body.getReader();
          const chunks = [];
          let loaded = 0;

          function pump() {
            return reader.read().then(({ done, value }) => {
              if (settled) return;
              if (done) {
                if (settled) return;
                settled = true;
                controllers.forEach((c, j) => { if (j !== i) c.abort(); });
                const buf = new Uint8Array(loaded);
                let off = 0;
                for (const ch of chunks) { buf.set(ch, off); off += ch.length; }
                resolve(buf.buffer);
                return;
              }
              chunks.push(value);
              loaded += value.length;
              if (onProgress) onProgress(loaded, total || loaded);
              return pump();
            });
          }
          return pump();
        })
        .catch(e => {
          if (settled) return;
          failures++;
          if (failures >= urls.length) {
            reject(new Error('All mirrors failed: ' + e.message));
          }
        });
    });
  });
}

/* Resample audio buffer to 16kHz mono using OfflineAudioContext */
async function resampleTo16k(buffer) {
  const targetLen = Math.round(buffer.duration * CED_SR);
  const offCtx = new OfflineAudioContext(1, targetLen, CED_SR);
  const src = offCtx.createBufferSource();
  src.buffer = buffer;
  src.connect(offCtx.destination);
  src.start(0);
  const rendered = await offCtx.startRendering();
  return rendered.getChannelData(0);
}

/* Run analysis on all tracks sequentially */
async function runAnalysisAll(allTracks) {
  for (const t of allTracks) { if (!t.analysisResults) await runAnalysis(t); }
}
/* Run analysis on all tracks in a group sequentially */
async function runAnalysisGroup(allTracks, groupId) {
  for (const t of allTracks) { if (t.groupId===groupId && !t.analysisResults) await runAnalysis(t); }
}

/* Run analysis on a track */
async function runAnalysis(track) {
  if (track.analysisResults) return; /* already analyzed */
  if (!track.buffer) { /* lazy track — load first, then analyze */
    await loadTrack(track);
    if (!track.buffer) return; /* decode failed */
    updateCardInfo(track.el);
  }
  const btn = track.analyzeBtn;
  const strip = track.analysisStrip;
  if (!btn || !strip) return;

  btn.disabled = true;
  btn.textContent = 'Loading...';
  strip.classList.remove('empty');
  strip.innerHTML = '<div class="analysis-progress"><div class="spinner" style="display:inline-block;vertical-align:middle;margin-right:6px"></div>Downloading CED-tiny model...</div>';
  cedProgressEl = strip.querySelector('.analysis-progress');

  let session;
  try {
    session = await loadCedModel();
    cedProgressEl = null;
    console.log('CED model loaded. Inputs:', session.inputNames, 'Outputs:', session.outputNames);
  } catch(e) {
    strip.innerHTML = '<div class="analysis-progress" style="color:#e74c3c">Failed to load model: ' + esc(String(e.message || e)) + '</div>';
    btn.textContent = 'Analyze';
    btn.disabled = false;
    console.error('Model load error:', e);
    return;
  }

  btn.textContent = 'Analyzing...';
  strip.innerHTML = '<div class="analysis-progress"><div class="spinner" style="display:inline-block;vertical-align:middle;margin-right:6px"></div>Resampling to 16kHz...</div>';

  /* Resample */
  let pcm16k;
  try {
    pcm16k = await resampleTo16k(track.buffer);
    console.log('Resampled to 16kHz:', pcm16k.length, 'samples');
  } catch(e) {
    strip.innerHTML = '<div class="analysis-progress" style="color:#e74c3c">Resample failed: ' + esc(String(e.message || e)) + '</div>';
    btn.textContent = 'Analyze';
    btn.disabled = false;
    console.error('Resample error:', e);
    return;
  }

  /* Get input name */
  const inputName = session.inputNames[0];

  /* Chunk and run inference */
  const nChunks = Math.max(1, Math.ceil(pcm16k.length / CED_CHUNK_SAMPLES));
  const chunkResults = []; /* array of { startSec, endSec, labels: [{idx, prob}] } */

  for (let i = 0; i < nChunks; i++) {
    const startSample = i * CED_CHUNK_SAMPLES;
    const endSample = Math.min(startSample + CED_CHUNK_SAMPLES, pcm16k.length);
    const chunk = new Float32Array(CED_CHUNK_SAMPLES);
    chunk.set(pcm16k.subarray(startSample, endSample));

    strip.innerHTML = '<div class="analysis-progress"><div class="spinner" style="display:inline-block;vertical-align:middle;margin-right:6px"></div>Analyzing chunk '+(i+1)+'/'+nChunks+'...</div>';

    /* Yield to UI */
    await new Promise(r => setTimeout(r, 0));

    try {
      const tensor = new ort.Tensor('float32', chunk, [1, chunk.length]);
      if (i === 0) console.log('First chunk tensor shape:', [1, chunk.length], 'inputName:', inputName);
      const result = await session.run({ [inputName]: tensor });
      const output = result[session.outputNames[0]];
      if (i === 0) console.log('First chunk output shape:', output.dims, 'sample values:', Array.from(output.data.slice(0, 5)));
      const probs = output.data;

      /* Build scored list, excluding blacklisted labels */
      const scored = [];
      for (let k = 0; k < probs.length; k++) {
        if (CED_BLACKLIST.has(k)) continue;
        scored.push({ idx: k, prob: probs[k] });
      }
      /* Take top N by confidence */
      scored.sort((a, b) => b.prob - a.prob);
      const topN = scored.slice(0, CED_TOP_N);

      /* Apply per-category threshold */
      const labels = topN.filter(l => {
        const thresh = CED_COMMON.has(l.idx) ? CED_THRESH_COMMON : CED_THRESH_RARE;
        return l.prob >= thresh;
      });

      const startSec = startSample / CED_SR;
      const endSec = endSample / CED_SR;
      chunkResults.push({ startSec, endSec, labels });
    } catch(e) {
      console.error('Inference error chunk', i, e);
      chunkResults.push({ startSec: startSample/CED_SR, endSec: endSample/CED_SR, labels: [] });
    }
  }

  /* Post-process: merge consecutive chunks with the same label into spans */
  track.analysisResults = postProcessAnalysis(chunkResults, track.duration);
  renderAnalysisStrip(track);
  btn.textContent = 'Done';
}

/* Merge consecutive chunk detections of the same label into continuous spans.
   Returns array of { label, labelIdx, startSec, endSec, maxProb } */
function postProcessAnalysis(chunkResults, duration) {
  /* Build per-label timeline: for each label, collect all chunks where it was detected */
  const labelMap = new Map(); /* labelIdx → [{startSec, endSec, prob}] */

  for (const cr of chunkResults) {
    for (const l of cr.labels) {
      if (!labelMap.has(l.idx)) labelMap.set(l.idx, []);
      labelMap.get(l.idx).push({ startSec: cr.startSec, endSec: cr.endSec, prob: l.prob });
    }
  }

  const spans = [];
  const chunkDur = CED_CHUNK_SEC;
  const mergeGap = chunkDur * 1.5; /* merge if gap ≤ 1.5 chunks */

  for (const [labelIdx, chunks] of labelMap) {
    chunks.sort((a, b) => a.startSec - b.startSec);

    let spanStart = chunks[0].startSec;
    let spanEnd = chunks[0].endSec;
    let maxProb = chunks[0].prob;

    for (let i = 1; i < chunks.length; i++) {
      if (chunks[i].startSec - spanEnd <= mergeGap) {
        /* extend */
        spanEnd = chunks[i].endSec;
        if (chunks[i].prob > maxProb) maxProb = chunks[i].prob;
      } else {
        /* emit span */
        spans.push({ label: AUDIOSET_LABELS[labelIdx], labelIdx, startSec: spanStart, endSec: spanEnd, maxProb });
        spanStart = chunks[i].startSec;
        spanEnd = chunks[i].endSec;
        maxProb = chunks[i].prob;
      }
    }
    spans.push({ label: AUDIOSET_LABELS[labelIdx], labelIdx, startSec: spanStart, endSec: spanEnd, maxProb });
  }

  /* Sort by start time, then by probability */
  spans.sort((a, b) => a.startSec - b.startSec || b.maxProb - a.maxProb);
  return spans;
}

/* Render analysis spans into the strip element */
function renderAnalysisStrip(track) {
  const strip = track.analysisStrip;
  const spans = track.analysisResults;
  if (!strip || !spans || !spans.length) {
    if (strip) { strip.innerHTML = '<div class="analysis-progress">No events detected above 50%</div>'; }
    return;
  }
  strip.innerHTML = '';
  strip.classList.remove('empty');

  const dur = track.duration;

  /* Assign rows via greedy interval scheduling to avoid overlaps */
  const rows = []; /* each row is array of spans with their end times */
  const spanRows = new Map(); /* span → row index */

  for (const sp of spans) {
    let placed = false;
    for (let r = 0; r < rows.length; r++) {
      const lastEnd = rows[r];
      if (sp.startSec >= lastEnd - 0.01) {
        rows[r] = sp.endSec;
        spanRows.set(sp, r);
        placed = true;
        break;
      }
    }
    if (!placed) {
      spanRows.set(sp, rows.length);
      rows.push(sp.endSec);
    }
  }

  /* Create row divs */
  const rowEls = [];
  for (let r = 0; r < rows.length; r++) {
    const rowEl = document.createElement('div');
    rowEl.className = 'analysis-row';
    strip.appendChild(rowEl);
    rowEls.push(rowEl);
  }

  /* Color assignment: consistent per unique label */
  const labelColorMap = new Map();
  let colorIdx = 0;

  for (const sp of spans) {
    if (!labelColorMap.has(sp.labelIdx)) {
      labelColorMap.set(sp.labelIdx, ANALYSIS_COLORS[colorIdx % ANALYSIS_COLORS.length]);
      colorIdx++;
    }
    const color = labelColorMap.get(sp.labelIdx);
    const row = spanRows.get(sp);
    const leftPct = (sp.startSec / dur * 100);
    const widthPct = ((sp.endSec - sp.startSec) / dur * 100);

    const tag = document.createElement('div');
    tag.className = 'analysis-tag';
    tag.style.left = leftPct + '%';
    tag.style.width = Math.max(widthPct, 0.5) + '%';
    tag.style.background = color + '33';
    tag.style.color = color;
    tag.style.borderColor = color + '66';
    tag.textContent = sp.label;
    tag.title = sp.label + ' (' + (sp.maxProb * 100).toFixed(0) + '%) ' +
      sp.startSec.toFixed(1) + 's–' + sp.endSec.toFixed(1) + 's';
    rowEls[row].appendChild(tag);
  }
}

/* ========================================================================
 *  EVENTS
 * ======================================================================== */
dropZone.addEventListener('click',()=>fileInput.click());
fileInput.addEventListener('change',e=>{handleDroppedItems(e.target.files);e.target.value='';});

/* Full-page drag-and-drop */
const dropOverlay = document.getElementById('drop-overlay');
let dragCounter = 0;
document.addEventListener('dragenter',e=>{e.preventDefault();dragCounter++;dropOverlay.classList.add('visible');});
document.addEventListener('dragleave',e=>{e.preventDefault();dragCounter--;if(dragCounter<=0){dragCounter=0;dropOverlay.classList.remove('visible');}});
document.addEventListener('dragover',e=>{e.preventDefault();});
document.addEventListener('drop',e=>{e.preventDefault();dragCounter=0;dropOverlay.classList.remove('visible');processDroppedEntries(e.dataTransfer);});

btnPlay.addEventListener('click',togglePlay);
btnStop.addEventListener('click',stopAll);
btnZoomIn.addEventListener('click', zoomIn);
btnZoomOut.addEventListener('click', zoomOut);
btnZoomFit.addEventListener('click', zoomFit);
btnAnalyzeAll.addEventListener('click', () => { runAnalysisAll(tracks); });
btnGrouping.addEventListener('click', toggleAutoGroup);
const chkWaveform = document.getElementById('chk-waveform');
chkWaveform.addEventListener('change', () => { setWaveformVisible(chkWaveform.checked); });
const chkMeta = document.getElementById('chk-meta');
chkMeta.addEventListener('change', () => { setMetaVisible(chkMeta.checked); });
tracksBox.addEventListener('scroll', onMetaScroll, { passive: true });
/* click a JSON key → toggle that field on every row; click a selected
   block's label to remove that field */
document.addEventListener('click', e => {
  const lbl = e.target && e.target.closest ? e.target.closest('.meta-sel-lbl') : null;
  if (lbl && lbl.dataset.path) { removeMetaKey(lbl.dataset.path); return; }
  const k = e.target && e.target.closest ? e.target.closest('.js-meta-key') : null;
  if (k && k.dataset.path) toggleMetaKey(k.dataset.path);
});
btnClear.addEventListener('click',clearAll);

document.addEventListener('keydown',e=>{
  if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)) return;
  /* Zoom shortcuts: Shift+Up/Down/Left */
  if(e.shiftKey && e.code==='ArrowUp'){e.preventDefault();zoomIn();return;}
  if(e.shiftKey && e.code==='ArrowDown'){e.preventDefault();zoomOut();return;}
  if(e.shiftKey && e.code==='ArrowLeft'){e.preventDefault();zoomFit();return;}
  /* Delete active track */
  if(e.code==='Delete'){e.preventDefault();deleteActiveTrack();return;}
  /* Card navigation: Up/Down (no modifier) */
  if(!e.shiftKey && e.code==='ArrowUp'){e.preventDefault();moveToPrevCard();return;}
  if(!e.shiftKey && e.code==='ArrowDown'){e.preventDefault();moveToNextCard();return;}
  if(e.code==='Space'&&e.shiftKey){e.preventDefault();switchLane();}
  else if(e.code==='Space'){e.preventDefault();togglePlay();}
  if(e.code==='Escape'){e.preventDefault();stopAll();}
  if(e.code==='ArrowLeft'&&!e.shiftKey){e.preventDefault();const t=getActive();if(t)seek(getPos(t)-2);}
  if(e.code==='ArrowRight'&&!e.shiftKey){e.preventDefault();const t=getActive();if(t)seek(getPos(t)+2);}
  if(e.code==='Backspace'){e.preventDefault();const t=getActive();if(t){seek(0);}}
});

/* Surface otherwise-silent JS errors so problems are visible on screen
   (e.g. a misbehaving worker or extension) instead of leaving the page
   quietly degraded. */
const _errShown = new Set();
function _surfaceError(tag, err) {
  try {
    const msg = String((err && (err.message || err)) || tag).slice(0, 300);
    if (_errShown.has(msg)) return;
    _errShown.add(msg);
    console.error(tag, err);
    streamProgFlash(tag + ': ' + msg);
  } catch (e) {}
}
window.addEventListener('error', (e) => { _surfaceError('JS error', e.error || e.message); });
window.addEventListener('unhandledrejection', (e) => { _surfaceError('Promise error', e.reason); });

/* Restore a previously dragged JSON-panel width, if any. */
(function() {
  try {
    const saved = localStorage.getItem('specview-meta-width');
    if (saved) document.documentElement.style.setProperty('--meta-width', saved);
  } catch (e) {}
})();

refreshUI();
})();
