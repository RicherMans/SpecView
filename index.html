/* Build a Blob worker from the source of a self-contained function, with an
   optional prelude (e.g. constants) injected before the function body. */
function makeBlobWorker(fn, prelude) {
  const src = (prelude ? prelude + '\n' : '') + '(' + fn.toString() + ')();';
  const url = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
  const w = new Worker(url);
  return w;
}

/* ---- spectrogram worker main -------------------------------------------
   Self-contained (no outer-scope references).  Mirrors computeSpec() in the
   main thread but batches four FFT frames into one WASM SIMD call. */
function specWorkerMain() {
  'use strict';
  const FFT_SIZE = 2048, HOP_DIV = 4, MAX_FRAMES = 12000, NLANES = 4;

  const HANN = new Float32Array(FFT_SIZE);
  for (let i = 0; i < FFT_SIZE; i++) HANN[i] = 0.5 * (1 - Math.cos(2 * Math.PI * i / (FFT_SIZE - 1)));

  const DB_F32 = new Float32Array(1);
  const DB_U32 = new Uint32Array(DB_F32.buffer);
  const DB_2 = 10 * Math.log10(2);
  const DB_MANT = new Float32Array(1025);
  for (let i = 0; i < 1024; i++) DB_MANT[i] = 10 * Math.log10(1 + i / 1024);
  DB_MANT[1024] = DB_2;
  function powToDb(p) {
    if (p <= 0) return -140;
    DB_F32[0] = p;
    const bits = DB_U32[0];
    const e = (bits >>> 23) & 0xff;
    if (e === 0) return -140;
    const m = bits & 0x7fffff;
    const idx = m >>> 13;
    const frac = (m & 0x1fff) / 8192;
    return (e - 127) * DB_2 + DB_MANT[idx] + (DB_MANT[idx + 1] - DB_MANT[idx]) * frac;
  }

  let wasmInit = null;
  let dre = null, dim = null, fftFn = null;
  function ensureWasm() {
    if (!wasmInit) {
      wasmInit = (async () => {
        try {
          if (typeof __WASM_B64 !== 'string') return false;
          const bin = Uint8Array.from(atob(__WASM_B64), c => c.charCodeAt(0));
          const { instance } = await WebAssembly.instantiate(bin, { env: { cos: Math.cos, sin: Math.sin } });
          instance.exports.init();
          dre = new Float32Array(instance.exports.memory.buffer, instance.exports.get_dre(), FFT_SIZE * NLANES);
          dim = new Float32Array(instance.exports.memory.buffer, instance.exports.get_dim(), FFT_SIZE * NLANES);
          fftFn = instance.exports.fft;
          return true;
        } catch (e) {
          console.warn('SpecView: WASM FFT unavailable, using main-thread fallback.', e);
          return false;
        }
      })();
    }
    return wasmInit;
  }

  function computeSpecTask(raw, sr, H, maxBin) {
    const nS = raw.length;
    let hop = FFT_SIZE / HOP_DIV;
    let nF = Math.max(1, Math.floor((nS - FFT_SIZE) / hop) + 1);
    if (nF > MAX_FRAMES) {
      hop = Math.max(1, Math.ceil((nS - FFT_SIZE) / (MAX_FRAMES - 1)));
      nF = Math.max(1, Math.floor((nS - FFT_SIZE) / hop) + 1);
    }
    const colDb = new Float32Array(nF * H);
    const rowBin = new Float32Array(H);
    for (let y = 0; y < H; y++) rowBin[y] = (1 - y / (H - 1)) * maxBin;
    const dbA = new Float32Array(maxBin + 2), dbB = new Float32Array(maxBin + 2);
    const totalPairs = (nF + 1) >> 1;

    const writeCol = (dbArr, f) => {
      if (f >= nF) return;
      const base = f * H;
      for (let y = 0; y < H; y++) {
        const fb = rowBin[y]; const b0 = fb | 0; const t = fb - b0;
        const b1 = b0 < maxBin ? b0 + 1 : b0;
        colDb[base + y] = dbArr[b0] + (dbArr[b1] - dbArr[b0]) * t;
      }
    };
    const unpack = (l) => {
      for (let k = 0; k <= maxBin; k++) {
        const nk = (FFT_SIZE - k) & (FFT_SIZE - 1);
        const x0 = dre[k * NLANES + l], y0 = dim[k * NLANES + l];
        const x1 = dre[nk * NLANES + l], y1 = dim[nk * NLANES + l];
        const rA = x0 + x1, iA = y0 - y1;   /* 2·A[k]  */
        const rB = y0 + y1, iB = x1 - x0;   /* 2·B[k]  */
        dbA[k] = powToDb((rA * rA + iA * iA) * 0.25);
        dbB[k] = powToDb((rB * rB + iB * iB) * 0.25);
      }
    };

    for (let p0 = 0; p0 < totalPairs; p0 += NLANES) {
      const lanes = Math.min(NLANES, totalPairs - p0);
      for (let i = 0; i < FFT_SIZE; i++)
        for (let l = lanes; l < NLANES; l++) { dre[i * NLANES + l] = 0; dim[i * NLANES + l] = 0; }
      for (let l = 0; l < lanes; l++) {
        const p = p0 + l;
        const fA = 2 * p, offA = fA * hop;
        const fB = fA + 1, offB = offA + hop;
        const hasA = fA < nF, hasB = fB < nF;
        for (let i = 0; i < FFT_SIZE; i++) {
          const ia = offA + i, ib = offB + i;
          dre[i * NLANES + l] = hasA && ia < nS ? raw[ia] * HANN[i] : 0;
          dim[i * NLANES + l] = hasB && ib < nS ? raw[ib] * HANN[i] : 0;
        }
      }
      fftFn();
      for (let l = 0; l < lanes; l++) {
        unpack(l);
        const p = p0 + l;
        writeCol(dbA, 2 * p);
        writeCol(dbB, 2 * p + 1);
      }
    }
    let peak = -Infinity;
    for (let i = 0; i < colDb.length; i++) if (colDb[i] > peak) peak = colDb[i];
    return { colDb, nF, hop, maxBin, peak };
  }

  onmessage = async (ev) => {
    const m = ev.data || {};
    if (m.type !== 'spec') return;
    try {
      const ok = await ensureWasm();
      if (!ok) { postMessage({ type: 'error', id: m.id, error: 'nowasm' }); return; }
      const res = computeSpecTask(m.samples, m.sr, m.H, m.maxBin);
      postMessage({ type: 'done', id: m.id, H: m.H, colDb: res.colDb, nF: res.nF, hop: res.hop, maxBin: res.maxBin, peak: res.peak },
        [res.colDb.buffer]);
    } catch (e) {
      postMessage({ type: 'error', id: m.id, error: String((e && e.message) || e) });
    }
  };
}

/* ---- main-thread spectrogram worker bridge ------------------------------ */
let specWorker = null;                 /* Worker | 'fail' | null */
let specJobSeq = 0;
let specEngine = 'none';               /* debug: wasm | inline | none */
const specPending = new Map();         /* id -> { track, resolve } */

function getSpecWorker() {
  if (specWorker !== null) return specWorker === 'fail' ? null : specWorker;
  try {
    specWorker = makeBlobWorker(specWorkerMain, 'const __WASM_B64=' + JSON.stringify(SPEC_WASM_B64) + ';');
    specWorker.onmessage = (ev) => {
      const m = ev.data || {};
      const pend = specPending.get(m.id);
      if (!pend) return;
      specPending.delete(m.id);
      const t = pend.track;
      if (!isTrackAlive(t)) { pend.resolve(); return; }
      if (m.type === 'done') {
        if (!t.specData) {
          t.specData = m.colDb;
          t.specFrames = m.nF; t.specHop = m.hop; t.specH = m.H;
          t.specMaxBin = m.maxBin; t.specGlobalPeak = m.peak;
          specEngine = 'wasm';
        }
      } else {
        /* worker error / missing WASM → fall back to inline compute */
        specEngine = 'inline';
        if (!t.specData) { try { computeSpec(t, m.H || pend.H); } catch (e) { console.error('Spec compute failed:', t.name, e); } }
      }
      pend.resolve();
    };
    specWorker.onerror = (e) => {
      console.warn('SpecView: spectrogram worker failed, switching to inline compute.', e);
      specWorker = 'fail';
      for (const [id, pend] of specPending) {
        specPending.delete(id);
        const t = pend.track;
        if (isTrackAlive(t)) { try { computeSpec(t, pend.H); } catch (err) {} }
        pend.resolve();
      }
    };
    return specWorker;
  } catch (e) {
    specWorker = 'fail';
    return null;
  }
}

/* Mono copy of a track's samples, safe to transfer into a worker. */
function monoTransferable(t) {
  const b = t.buffer;
  const ch = b.numberOfChannels === 1 ? b.getChannelData(0) : mixDown(b);
  const out = new Float32Array(ch.length);
  out.set(ch);
  return out;
}

/* Guarantee track.specData is filled. Uses the worker when available, else
   the original synchronous computeSpec(). Idempotent per track. */
function ensureSpec(t) {
  if (isMultiTrack(t)) {
    /* Multichannel: one STFT per channel (inline; spec cached per buffer+ch). */
    for (let i = 0; i < t.chViews.length; i++) {
      restoreSpecCache(t, i);
      const lane = t.chViews[i];
      if (!lane.specData) computeSpec(t, lane.canvas ? lane.canvas.height : CH_SPEC_H, i);
    }
    return Promise.resolve();
  }
  if (t.specData) return Promise.resolve();
  if (t._specPromise) return t._specPromise;
  const H = t.canvas && t.canvas.height ? t.canvas.height : SPEC_H;
  const w = getSpecWorker();
  if (!w) {
    if (t.buffer) computeSpec(t, H);
    return Promise.resolve();
  }
  /* maxBin must match the inline computeSpec(): it caps the display range to
     the *native* nyquist (track.nyquist, from the file header), NOT sr/2 —
     decodeAudioData() resamples buffers to the AudioContext rate, which is
     usually higher than the source sample rate. */
  const b = t.buffer;
  const sr = b.sampleRate;
  const maxBin = Math.min(FFT_SIZE >> 1, Math.ceil(t.nyquist / (sr / FFT_SIZE)));
  const samples = monoTransferable(t);
  t._specPromise = new Promise((resolve) => {
    const id = ++specJobSeq;
    specPending.set(id, { track: t, H, resolve });
    w.postMessage({ type: 'spec', id, samples, sr, H, maxBin }, [samples.buffer]);
  }).finally(() => { t._specPromise = null; });
  return t._specPromise;
}

/* Debug/test hook (unused in production). */
window.__specview = {
  get specEngine() { return specEngine; },
  get specWorker() { return specWorker === null ? 'unused' : (specWorker === 'fail' ? 'inline' : 'worker'); },
  get pendingCards() { return pendingCards.length; },
  get renderedCards() { return renderedCards.length; },
  get releasedTop() { return releasedTop.length; },
  get trackCount() { return tracks.length; },
  get groupCount() { return groups.length; },
  get loadedCount() { return tracks.filter(t => t.loaded).length; },
};

/* Fast RIFF/WAVE PCM decoder → AudioBuffer, avoiding the much slower
   audioCtx.decodeAudioData() for plain PCM .wav files (common in
   webdataset/ACAV shards). Returns null for anything else so callers
   fall back to decodeAudioData. */
function decodeWavBuffer(arrayBuffer) {
  const v = new DataView(arrayBuffer);
  if (v.byteLength < 12) return null;
  if (v.getUint32(0, true) !== 0x46464952) return null;   /* 'RIFF' */
  if (v.getUint32(8, true) !== 0x45564157) return null;   /* 'WAVE' */

  let fmt = null, dataOff = -1, dataLen = 0;
  let off = 12;
  while (off + 8 <= v.byteLength) {
    const id = v.getUint32(off, true);
    const size = v.getUint32(off + 4, true);
    const body = off + 8;
    if (id === 0x20746D66) {                              /* 'fmt ' */
      if (body + 16 <= v.byteLength) {
        fmt = {
          format: v.getUint16(body, true),
          channels: v.getUint16(body + 2, true),
          sampleRate: v.getUint32(body + 4, true),
          blockAlign: v.getUint16(body + 12, true),
          bits: v.getUint16(body + 14, true),
        };
      }
    } else if (id === 0x61746164) {                       /* 'data' */
      dataOff = body; dataLen = size;
      break;
    }
    if (size === 0) break;
    off = body + size + (size & 1);
  }
  if (!fmt || dataOff < 0 || fmt.channels < 1 || fmt.channels > 32 ||
      !(fmt.sampleRate > 0) || fmt.blockAlign < 1) return null;

  const isPcm = fmt.format === 1;
  const isFloat = fmt.format === 3 && fmt.bits === 32;
  if (!isPcm && !isFloat) return null;
  const bps = fmt.bits >> 3;
  if (bps < 1 || fmt.blockAlign !== bps * fmt.channels) return null;

  const usable = Math.min(dataLen, v.byteLength - dataOff);
  const frames = Math.floor(usable / fmt.blockAlign);
  if (frames < 1) return null;

  let buf;
  try { buf = audioCtx.createBuffer(fmt.channels, frames, fmt.sampleRate); }
  catch (e) { return null; }
  const stride = fmt.blockAlign;

  if (isFloat) {
    for (let ch = 0; ch < fmt.channels; ch++) {
      const d = buf.getChannelData(ch);
      const base = ch * 4;
      for (let f = 0; f < frames; f++) d[f] = v.getFloat32(dataOff + f * stride + base, true);
    }
  } else if (fmt.bits === 8) {
    for (let ch = 0; ch < fmt.channels; ch++) {
      const d = buf.getChannelData(ch);
      for (let f = 0; f < frames; f++) d[f] = (v.getUint8(dataOff + f * stride + ch) - 128) / 128;
    }
  } else if (fmt.bits === 16) {
    for (let ch = 0; ch < fmt.channels; ch++) {
      const d = buf.getChannelData(ch);
      const base = ch * 2;
      for (let f = 0; f < frames; f++) d[f] = v.getInt16(dataOff + f * stride + base, true) / 32768;
    }
  } else if (fmt.bits === 24) {
    for (let ch = 0; ch < fmt.channels; ch++) {
      const d = buf.getChannelData(ch);
      const base = ch * 3;
      for (let f = 0; f < frames; f++) {
        const b = dataOff + f * stride + base;
        let s = v.getUint8(b) | (v.getUint8(b + 1) << 8) | (v.getUint8(b + 2) << 16);
        if (s & 0x800000) s |= ~0xFFFFFF;
        d[f] = s / 8388608;
      }
    }
  } else if (fmt.bits === 32) {
    for (let ch = 0; ch < fmt.channels; ch++) {
      const d = buf.getChannelData(ch);
      const base = ch * 4;
      for (let f = 0; f < frames; f++) d[f] = v.getInt32(dataOff + f * stride + base, true) / 2147483648;
    }
  } else {
    return null;
  }
  return buf;
}

/* Decode audio bytes to an AudioBuffer: fast path for PCM WAVs, otherwise
   the standard decodeAudioData (handles MP3/OGG/FLAC/…). */
async function decodeToAudioBuffer(arrayBuffer) {
  const fast = decodeWavBuffer(arrayBuffer);
  if (fast) return fast;
  return audioCtx.decodeAudioData(arrayBuffer.slice(0));
}

/* Per-card render queue: rasterize at most one finished card per animation
   frame, so several files completing together don't stall the main thread. */
const renderQueue = [];
let renderQueued = false;
function queueCardRender(job) {
  renderQueue.push(job);
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(function pump() {
    const next = renderQueue.shift();
    if (next) { try { next(); } catch (e) { console.error('Card render error:', e); } }
    if (renderQueue.length) requestAnimationFrame(pump);
    else renderQueued = false;
  });
}

/* Decode a single lazy track: read file → parse SR → decode → render */
async function loadTrack(t) {
  if (t.loaded || t._loading || !t.file) return;
  t._loading = true;
  const epoch = clearEpoch;   /* bail out if Clear All happens mid-decode */

  const loadingEl = t.wrapper ? t.wrapper.querySelector('.loading-overlay') : null;
  if (loadingEl) loadingEl.innerHTML = '<div class="spinner"></div>Decoding…';

  try {
    const arrBuf = await t.file.arrayBuffer();
    if (!isTrackAlive(t) || epoch !== clearEpoch) return;  /* removed / cleared during async gap */

    const nativeSR = parseNativeSampleRate(arrBuf) || null;
    const decoded = await decodeToAudioBuffer(arrBuf);
    if (!isTrackAlive(t) || epoch !== clearEpoch) return;  /* removed / cleared during async gap */

    t.buffer   = decoded;
    t.loaded   = true;
    t.duration = decoded.duration;
    t.sr       = nativeSR || decoded.sampleRate;
    t.nativeSR = t.sr;
    t.renderSR = decoded.sampleRate;
    t.nyquist  = t.sr / 2;
    t.viewEnd  = decoded.duration;
    /* keep t.file: recycled cards re-decode from it when restored (it is a
       lightweight handle for archive entries, or a browser-backed File) */

    /* Multichannel (2–8ch): expand to per-channel lanes. Such files never stay
       in a diff group — split them out into standalone cards. */
    const nCh = decoded.numberOfChannels;
    if (nCh > 1 && !t.isMulti) {
      if (t.groupId != null) {
        if (isTrackAlive(t)) splitMultiOutOfGroup(t);
        if (loadingEl && loadingEl.parentNode) loadingEl.remove();
        t._loading = false;
        return;
      }
      if (nCh <= 8) {
        rebuildBodyAsMulti(t);
        if (t.nyquist > 0) {
          const bodies = new Set();
          for (const chv of t.chViews) { const b = chv.canvas && chv.canvas.closest('.track-body'); if (b) bodies.add(b); }
          for (const b of bodies) b.querySelectorAll('.freq-labels').forEach(fl => { if (!fl.querySelector('.freq-tick')) addFreqLabels(fl, t.nyquist); });
        }
        if (t._pendingRender) { t._pendingRender(); t._pendingRender = null; }
        updateCardInfo(t.el);
        updateRuler(t);
        t._loading = false;
        return;
      }
    }

    if (t.wrapper && t.canvas) {
      const w = t.wrapper.clientWidth;
      if (w > 0) {
        t.canvas.width = w;
        if (t.waveformCanvas) t.waveformCanvas.width = w;
        const freqEl = t.wrapper.parentElement
          ? t.wrapper.parentElement.querySelector('.freq-labels')
          : null;
        if (freqEl) { freqEl.innerHTML = ''; addFreqLabels(freqEl, t.nyquist); }
        /* rasterize on the per-frame queue (ensureSpec off-thread + draw)
           so bursts of finished decodes don't block the UI */
        queueCardRender(() => {
          if (!isTrackAlive(t)) return;
          ensureSpec(t).then(() => {
            if (!isTrackAlive(t)) return;
            paintTrackCanvas(t);
            const le = t.wrapper ? t.wrapper.querySelector('.loading-overlay') : null;
            if (le && le.parentNode) le.remove();
            updateRuler(t);
            updateCardInfo(t.el);
          }).catch(() => {
            if (!isTrackAlive(t)) return;
            const le = t.wrapper ? t.wrapper.querySelector('.loading-overlay') : null;
            if (le && le.parentNode) le.remove();
          });
        });
      } else {
        if (loadingEl && loadingEl.parentNode) loadingEl.remove();
        updateRuler(t);
        updateCardInfo(t.el);
      }
    } else {
      if (loadingEl && loadingEl.parentNode) loadingEl.remove();
      updateRuler(t);
      updateCardInfo(t.el);
    }
  } catch(e) {
    console.error('Lazy decode error:', t.name, e);
    if (loadingEl) loadingEl.innerHTML = '<span style="color:#e74c3c;font-size:10px">Decode failed</span>';
  } finally {
    t._loading = false;
  }
}

/* Update a card's header info text after lazy tracks have loaded */
function updateCardInfo(cardEl) {
  const cardTracks = tracks.filter(t => t.el === cardEl);
  if (!cardTracks.length) return;
  const infoEl = cardEl.querySelector('.card-header .card-info');
  if (!infoEl) return;

  const gid = cardTracks[0].groupId;
  if (gid != null) {
    /* Diff group: show max duration */
    const loaded = cardTracks.filter(t => t.loaded);
    if (loaded.length) {
      const maxDur = Math.max(...loaded.map(t => t.duration));
      infoEl.textContent = fmt(maxDur);
    }
    /* Update per-lane sample rate labels */
    for (const t of cardTracks) {
      if (!t.loaded || !t.laneLabel) continue;
      const srEl = t.laneLabel.querySelector('.card-info');
      if (srEl) srEl.textContent = (t.sr/1000).toFixed(1)+'kHz';
    }
  } else {
    /* Standalone: show channels + SR + duration */
    const t = cardTracks[0];
    if (t.loaded && t.buffer) {
      const ch = t.buffer.numberOfChannels===1?'Mono':t.buffer.numberOfChannels===2?'Stereo':t.buffer.numberOfChannels+'ch';
      infoEl.textContent = ch+' '+(t.sr/1000).toFixed(1)+'kHz | '+fmt(t.duration);
    }
  }
}

/* ========================================================================
 *  TAR / TAR.GZ ARCHIVE SUPPORT
 *  Streams .tar / .tar.gz / .tgz through the native DecompressionStream
 *  and an incremental tar parser. Extraction is fault-tolerant: truncated
 *  or corrupt archives still yield every audio file that was fully read,
 *  and bad/partial entries are skipped instead of failing the whole file.
 *  (webdataset shards are ordinary tars — only their naming and occasional
 *  truncation differ.)
 * ======================================================================== */
 const TAR_EXT  = /\.(tar|tar\.gz|tgz)$/i;
 const AUDIO_RE = /\.(mp3|wav|ogg|flac|m4a|aac|webm|wma|aiff|opus)$/i;
 const SNIFF_LEN = 64;      /* magic-byte head sampled for unknown extensions */
 const META_RE   = /\.json$/i;
 const META_MAX  = 1 << 20;   /* skip huge .json payloads (metadata only) */

/* Guess MIME type from extension for audio files */
function guessAudioMime(name) {
  const ext = (name.match(/\.([^.]+)$/) || [])[1];
  if (!ext) return 'audio/unknown';
  const map = {
    mp3: 'audio/mpeg', wav: 'audio/wav', ogg: 'audio/ogg',
    flac: 'audio/flac', m4a: 'audio/mp4', aac: 'audio/aac',
    webm: 'audio/webm', wma: 'audio/x-ms-wma', aiff: 'audio/aiff',
    opus: 'audio/opus'
  };
  return map[ext.toLowerCase()] || 'audio/unknown';
}

/* Content-based audio detection via magic bytes (integer compares only —
   what `file`/ffprobe do). Used when the filename extension is unknown,
   e.g. webdataset shards whose audio payloads are named *.audio. Returns
   a MIME type or null. */
function sniffAudioMagic(b) {
  if (!b || b.length < 4) return null;
  if (b[0] === 0x49 && b[1] === 0x44 && b[2] === 0x33) return 'audio/mpeg';          /* ID3 */
  if (b[0] === 0xff && (b[1] & 0xe0) === 0xe0)                                      /* MPEG/ADTS sync */
    return ((b[1] >> 1) & 3) === 0 ? 'audio/aac' : 'audio/mpeg';                     /* layer 00 = ADTS AAC */
  if (b[0] === 0x52 && b[1] === 0x49 && b[2] === 0x46 && b[3] === 0x46 &&           /* RIFF....WAVE */
      b.length >= 12 && b[8] === 0x57 && b[9] === 0x41 && b[10] === 0x56 && b[11] === 0x45) return 'audio/wav';
  if (b[0] === 0x66 && b[1] === 0x4c && b[2] === 0x61 && b[3] === 0x43) return 'audio/flac';  /* fLaC */
  if (b[0] === 0x4f && b[1] === 0x67 && b[2] === 0x67 && b[3] === 0x53) return 'audio/ogg';   /* OggS */
  if (b[0] === 0x46 && b[1] === 0x4f && b[2] === 0x52 && b[3] === 0x4d &&           /* FORM....AIFF/C */
      b.length >= 12 && b[8] === 0x41 && b[9] === 0x49 && b[10] === 0x46 && (b[11] === 0x46 || b[11] === 0x43)) return 'audio/aiff';
  if (b.length >= 12 && b[4] === 0x66 && b[5] === 0x74 && b[6] === 0x79 && b[7] === 0x70) {  /* ftyp */
    const brand = String.fromCharCode(b[8], b[9], b[10], b[11]);
    if (brand === 'M4A ' || brand === 'M4B ' || brand === 'mp42' || brand === 'isom' || brand === 'mp41') return 'audio/mp4';
  }
  if (b[0] === 0x1a && b[1] === 0x45 && b[2] === 0xdf && b[3] === 0xa3) return 'audio/webm';  /* EBML */
  if (b[0] === 0x23 && b[1] === 0x21 && b[2] === 0x41 && b[3] === 0x4d && b.length > 4 && b[4] === 0x52) return 'audio/amr';  /* #!AMR */
  return null;
}

/* Streaming tar reader (shared by the live-display pass and the
   on-demand per-entry fetcher).

   feed(u8) is called as decompressed bytes arrive; nothing is buffered
   unless asked for. opts:
     onAudio(rec)  -> { seq, name, path, size, bytes:Uint8Array|null }
                      fired once an audio entry's payload has fully passed;
                      bytes are only present when captureAudio(seq) returned
                      true for it.
     onJson(j)     -> { name, path, text } for small .json files (emitJson)
     captureAudio(seq) -> predicate deciding whether to hold that payload
     emitJson      -> default true
   finish() reports what was salvaged. Never throws on malformed data. */
function createTarReader(opts) {
  opts = opts || {};
  const onAudio = opts.onAudio || function(){};
  const onJson = opts.onJson || function(){};
  const captureAudio = opts.captureAudio || null;
  const emitJson = opts.emitJson !== false;
  const REGULAR = new Set(['0', '\0', '']);
  const dec = new TextDecoder('utf-8');

  let state = 'header';            /* 'header' | 'payload' */
  let mode = null;                 /* 'audioCapture' | 'json' | 'meta' | 'skip' */
  let curName = '';
  let need = 0;                    /* payload bytes still to advance (512-aligned) */
  let dataLeft = 0;                /* bytes still to buffer out of payload */
  let dataParts = null, dataLen = 0;
  let metaOnDone = null;
  let pendingLongName = null, pendingPaxPath = null;
  let pendingAudio = null;         /* audio record waiting for its payload to pass */
  let pendingSniff = null;         /* unknown-ext record waiting for magic-byte sniff */
  let seqCount = 0;                /* audio headers seen (seq identity) */
  let audioEmitted = 0;

  let buf = null, bufLen = 0;
  let entries = 0;
  let corrupt = false;
  let eofSeen = false, eofBlocks = 0;

  function trim(bytes) {
    let end = bytes.length;
    while (end > 0 && (bytes[end - 1] === 0 || bytes[end - 1] === 0x20)) end--;
    return dec.decode(bytes.subarray(0, end));
  }
  function isZeroBlock(h) {
    for (let i = 0; i < 512; i++) if (h[i]) return false;
    return true;
  }
  function checksumValid(h) {
    let stored = 0, any = false;
    for (let i = 148; i < 156; i++) {
      const c = h[i];
      if (c === 0x20 || c === 0) continue;
      if (c < 0x30 || c > 0x37) { stored = -1; break; }
      stored = stored * 8 + (c - 0x30);
      any = true;
    }
    if (!any) stored = 0;
    if (stored < 0) return false;
    let sum = 0;
    for (let i = 0; i < 512; i++) {
      if (i >= 148 && i < 156) { sum += 0x20; continue; }
      sum += h[i];
    }
    return stored === sum;
  }
  function readSize(h) {
    if (h[124] & 0x80) {
      let v = h[124] & 0x7f;
      for (let i = 125; i < 136; i++) v = v * 256 + h[i];
      return v;
    }
    let v = 0, any = false;
    for (let i = 124; i < 136; i++) {
      const c = h[i];
      if (c === 0x20 || c === 0) continue;
      if (c < 0x30 || c > 0x37) return -1;
      v = v * 8 + (c - 0x30);
      any = true;
    }
    return any ? v : 0;
  }
  function startPayload(m, size, onDone) {
    mode = m;
    dataParts = (m === 'skip') ? null : [];
    dataLen = 0;
    dataLeft = size;
    metaOnDone = onDone || null;
    need = (Math.floor(size / 512) + (size % 512 ? 1 : 0)) * 512;
    if (need === 0) state = 'header';
    else state = 'payload';
  }
  function readMetaText() {
    const u8 = partsToBytes();
    return dec.decode(u8).replace(/\0+$/g, '');
  }
  function partsToBytes() {
    const u8 = new Uint8Array(dataLen);
    let o = 0;
    for (const p of dataParts) { u8.set(p, o); o += p.length; }
    dataParts = null; dataLen = 0;
    return u8;
  }
  function parsePax(text) {
    const out = {};
    let p = 0;
    while (p < text.length) {
      const sp = text.indexOf(' ', p);
      if (sp < 0) break;
      const len = parseInt(text.slice(p, sp), 10);
      if (!(len > 0) || sp + 1 + (len - (sp - p + 1)) > text.length) break;
      const body = text.slice(sp + 1, sp + 1 + (len - (sp - p + 1)));
      const eq = body.indexOf('=');
      if (eq > 0) out[body.slice(0, eq)] = body.slice(eq + 1).replace(/[\n\r\0]+$/, '');
      p = sp + 1 + (len - (sp - p + 1));
    }
    return out;
  }

  /* Decide audio-vs-other from the buffered head bytes of an unknown-ext
     entry. The head stays buffered as the payload prefix when it is audio. */
  function resolveSniff() {
    const rec = pendingSniff; pendingSniff = null;
    let head = null;
    if (rec && dataLen > 0) {
      if (dataParts.length === 1) head = dataParts[0];
      else {
        head = new Uint8Array(dataLen);
        let o = 0;
        for (const p of dataParts) { head.set(p, o); o += p.length; }
      }
    }
    const mime = head ? sniffAudioMagic(head) : null;
    if (mime && rec) {
      rec.seq = seqCount++;
      pendingAudio = rec;
      if (!!captureAudio && captureAudio(rec.seq)) {
        mode = 'audioCapture';          /* keep head bytes as payload prefix */
      } else {
        mode = 'skip';                  /* end handler emits bytes:null */
        dataParts = null; dataLen = 0;
      }
    } else {
      mode = 'skip';
      dataParts = null; dataLen = 0;
    }
  }

  function handleHeader(h) {
    const type = String.fromCharCode(h[156]);
    const size = readSize(h);
    if (size < 0) { corrupt = true; return false; }

    if (type === 'L') {
      startPayload('meta', size, () => { pendingLongName = readMetaText(); });
      return true;
    }
    if (type === 'x' || type === 'g') {
      const isPerFile = type === 'x';
      startPayload('meta', size, () => {
        const pax = parsePax(readMetaText());
        if (isPerFile && pax.path) pendingPaxPath = pax.path;
      });
      return true;
    }

    let name = trim(h.subarray(0, 100));
    if (pendingLongName !== null) { name = pendingLongName || name; pendingLongName = null; }
    if (pendingPaxPath !== null) { name = pendingPaxPath || name; pendingPaxPath = null; }
    const magic = dec.decode(h.subarray(257, 263));
    if (magic.indexOf('ustar') === 0) {
      const pfx = trim(h.subarray(345, 500));
      if (pfx) name = pfx + '/' + name;
    }

    const base = name.split('/').pop() || '';
    const isAudio = REGULAR.has(type) && size > 0 && AUDIO_RE.test(base);
    const isJson  = emitJson && REGULAR.has(type) && size > 0 && size <= META_MAX && META_RE.test(base);
    if (isAudio) {
      const seq = seqCount++;
      pendingAudio = { seq, name, path: name, size };
      curName = name;
      const want = !!captureAudio && captureAudio(seq);
      startPayload(want ? 'audioCapture' : 'skip', size, null);
    } else if (isJson) {
      curName = name;
      startPayload('json', size, null);
    } else if (REGULAR.has(type) && size > 0) {
      /* Unknown extension — decide by content (webdataset shards use bare
         suffixes like .audio holding ordinary mp3/wav bytes) */
      curName = name;
      pendingSniff = { seq: -1, name, path: name, size };
      startPayload('sniff', size, null);
    } else {
      curName = '';
      startPayload('skip', size, null);
    }
    return true;
  }

  function consume(n) {
    const out = buf.subarray(0, n);
    buf = buf.subarray(n); bufLen -= n;
    return out;
  }
  function resync() {
    const MAX_SCAN = 8192 * 512;
    let scanned = 0;
    while (bufLen >= 512 && scanned < MAX_SCAN) {
      const h = buf.subarray(0, 512);
      if (isZeroBlock(h)) return true;
      if (checksumValid(h)) return true;
      consume(512);
      scanned += 512;
    }
    return false;
  }

  function feed(chunk) {
    if (bufLen === 0) { buf = chunk; bufLen = chunk.length; }
    else {
      const merged = new Uint8Array(bufLen + chunk.length);
      merged.set(buf, 0);
      merged.set(chunk, bufLen);
      buf = merged; bufLen = merged.length;
    }

    while (bufLen > 0 || state === 'header') {
      if (state === 'header') {
        if (bufLen < 512) break;
        const h = buf.subarray(0, 512);
        if (isZeroBlock(h)) {
          consume(512);
          eofBlocks++;
          if (eofBlocks >= 2) eofSeen = true;
          continue;
        }
        eofBlocks = 0;
        if (!checksumValid(h)) {
          if (!resync()) { corrupt = true; return; }
          continue;
        }
        handleHeader(h);
        consume(512);
        entries++;
        if (state !== 'payload') continue;
      }

      while (state === 'payload' && bufLen > 0 && need > 0) {
        let m = Math.min(bufLen, need);
        let copy = Math.min(m, dataLeft);
        if (mode === 'sniff') {
          const room = SNIFF_LEN - dataLen;
          if (copy > room) { copy = room; m = room; }   /* stop at the sniff head */
          if (copy <= 0) { resolveSniff(); continue; }
        }
        if (copy > 0 && mode !== 'skip') {
          dataParts.push(buf.subarray(0, copy));
          dataLen += copy;
        }
        consume(m);
        need -= m;
        dataLeft -= copy;
        if (mode === 'sniff' && (dataLen >= SNIFF_LEN || dataLeft <= 0)) resolveSniff();
      }
      if (state !== 'payload') continue;
      if (need > 0) break;

      /* payload finished */
      if (mode === 'sniff') resolveSniff();
      if (mode === 'audioCapture') {
        const rec = pendingAudio; pendingAudio = null;
        onAudio({ seq: rec.seq, name: rec.name, path: rec.path, size: rec.size, bytes: partsToBytes() });
        audioEmitted++;
      } else if (mode === 'skip' && pendingAudio) {
        const rec = pendingAudio; pendingAudio = null;
        onAudio({ seq: rec.seq, name: rec.name, path: rec.path, size: rec.size, bytes: null });
        audioEmitted++;
      } else if (mode === 'json') {
        const text = dec.decode(partsToBytes()).replace(/\0+$/g, '');
        onJson({ name: curName, path: curName, text });
      } else if (mode === 'meta' && metaOnDone) {
        const cb = metaOnDone; metaOnDone = null;
        cb();
      }
      mode = null; curName = '';
      state = 'header';
    }
  }

  function finish() {
    const midPayload = state === 'payload' && need > 0;
    const midHeader = state === 'header' && bufLen > 0;
    return {
      entries,
      audioEmitted,
      truncated: corrupt || midPayload || midHeader,
      cleanEnd: eofSeen && !corrupt,
    };
  }

  return { feed, finish };
}

const GZ_RE = /\.(tar\.gz|tgz)$/i;

/* Per-archive on-demand reader. Nothing is held in memory — a request for
   entry seqN decompresses from the last cursor position (restarting only
   when a request arrives for an entry behind the cursor). */
function makeArchiveFetcher(file, isGz) {
  const cache = new Map();             /* seq -> Uint8Array (LRU, most-recent last) */
  const pending = new Map();           /* seq -> resolve(bytes|null) */
  let state = null;                    /* { tr, reader } */
  let curEmitted = 0;
  let busy = false;

  function cachePut(seq, bytes) {
    if (cache.has(seq)) cache.delete(seq);
    cache.set(seq, bytes);
    while (cache.size > ARCH_LRU_CAP) {
      const oldest = cache.keys().next().value;
      cache.delete(oldest);
    }
  }

  async function pump() {
    if (busy) return;
    busy = true;
    try {
      while (pending.size) {
        const min = Math.min(...pending.keys());
        if (state && curEmitted > min) {           /* jumped backwards */
          try { await state.reader.cancel(); } catch (e) {}
          state = null;
          curEmitted = 0;
        }
        if (!state) {
          let src = file.stream();
          if (isGz) src = src.pipeThrough(new DecompressionStream('gzip'));
          const reader = src.getReader();
          const tr = createTarReader({
            onAudio: r => {
              curEmitted = r.seq + 1;
              if (r.bytes) {
                cachePut(r.seq, r.bytes);
                if (pending.has(r.seq)) {
                  const res = pending.get(r.seq);
                  pending.delete(r.seq);
                  res(r.bytes);
                }
              }
            },
            emitJson: false,
            captureAudio: seq => pending.has(seq)
          });
          state = { tr, reader };
        }
        const { tr, reader } = state;
        let finished = false, err = null;
        while (pending.size && !finished && !err) {
          let r;
          try { r = await reader.read(); }
          catch (e) { err = e; break; }
          if (r.done) { finished = true; break; }
          tr.feed(r.value);
        }
        if (finished || err) {
          for (const k of [...pending.keys()]) {
            const res = pending.get(k);
            pending.delete(k);
            res(null);
          }
          state = null;
          curEmitted = 0;
        }
      }
    } finally {
      busy = false;
    }
  }

  return {
    fetch(seq) {
      const hit = cache.get(seq);
      if (hit) return Promise.resolve(hit);
      return new Promise(res => { pending.set(seq, res); pump(); });
    },
    peek(seq) { return cache.get(seq) || null; },
    prewarm(seq, bytes) { cachePut(seq, bytes); }
  };
}

/* A File-like handle for lazy tracks backed by an archive entry. Prewarmed
   entries (captured during the index pass) resolve immediately from the
   fetcher's LRU so the first cards can decode while the scan is still in
   flight; anything not yet prewarmed waits for the index pass to finish so
   the live decode never races the streaming decompression. */
function lazyAudioHandle(fetcher, seq, name, readyPromise) {
  return {
    name: name || '',
    arrayBuffer() {
      const hit = fetcher.peek(seq);
      if (hit) return Promise.resolve(hit.buffer);
      const ready = readyPromise || Promise.resolve();
      return ready.then(async () => {
        let bytes = null;
        for (let attempt = 0; attempt < 3 && !bytes; attempt++) {
          if (attempt) await new Promise(r => setTimeout(r, attempt * 60));
          bytes = await fetcher.fetch(seq);
        }
        if (!bytes) throw new Error('Audio entry unavailable (archive truncated)');
        return bytes.buffer;
      });
    }
  };
}

/* Small, non-blocking progress pill (never blocks scrolling). */
function streamProgEl() {
  let el = document.getElementById('stream-prog');
  if (!el) {
    el = document.createElement('div');
    el.id = 'stream-prog';
    el.className = 'stream-prog';
    document.body.appendChild(el);
  }
  return el;
}
function streamProgSet(text) {
  const el = streamProgEl();
  el.textContent = text;
  el.classList.add('show');
}
function streamProgFlash(text) {
  streamProgSet(text);
  setTimeout(() => { const el = document.getElementById('stream-prog'); if (el) el.classList.remove('show'); }, 2600);
}
function streamProgHide() {
  const el = document.getElementById('stream-prog');
  if (el) el.classList.remove('show');
}

/* Read all file entries from a dropped directory (top-level only, non-recursive) */
async function readDirectoryEntry(dirEntry) {
  return new Promise((resolve, reject) => {
    const reader = dirEntry.createReader();
    const allEntries = [];
    function readBatch() {
      reader.readEntries(entries => {
        if (entries.length === 0) { resolve(allEntries); return; }
        allEntries.push(...entries);
        readBatch(); /* readEntries returns max 100 entries per call */
      }, reject);
    }
    readBatch();
  });
}

function fileEntryToFile(fileEntry) {
  return new Promise((resolve, reject) => { fileEntry.file(resolve, reject); });
}

/* Process dropped items: handle both files and folders via webkitGetAsEntry */
async function processDroppedEntries(dataTransfer) {
  const items = dataTransfer.items;
  if (!items || !items.length) {
    /* Fallback for browsers without items API */
    if (dataTransfer.files && dataTransfer.files.length) {
      await handleDroppedItems(dataTransfer.files);
    }
    return;
  }

  /* Snapshot entries synchronously — webkitGetAsEntry() must be called
     within the drop event handler before any await */
  const entries = [];
  for (const item of items) {
    const entry = item.webkitGetAsEntry ? item.webkitGetAsEntry() : null;
    entries.push({ entry, item });
  }

  const allFiles = [];
  for (const { entry, item } of entries) {
    if (!entry) {
      const f = item.getAsFile ? item.getAsFile() : null;
      if (f) allFiles.push(f);
      continue;
    }
    if (entry.isDirectory) {
      try {
        const dirEntries = await readDirectoryEntry(entry);
        dirEntries.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }));
        for (const child of dirEntries) {
          if (child.isFile) {
            try { allFiles.push(await fileEntryToFile(child)); }
            catch (e) { console.error('Failed to read:', child.name, e); }
          }
        }
      } catch (e) { console.error('Failed to read directory:', entry.name, e); }
    } else {
      try { allFiles.push(await fileEntryToFile(entry)); }
      catch (e) { console.error('Failed to read:', entry.name, e); }
    }
  }
  if (allFiles.length > 0) await handleDroppedItems(allFiles);
}

/* Process dropped items: separate tar archives from regular audio files,
   stream-extract audio from archives, then feed everything into handleFiles.
   Truncated/corrupt archives are salvaged: every complete audio entry is
   kept, and a notice is shown instead of a hard error. */
async function handleDroppedItems(fileList) {
  const regularFiles = [];
  const tarFiles = [];
  const jsonFiles = [];

  for (const f of fileList) {
    if (TAR_EXT.test(f.name)) {
      tarFiles.push(f);
    } else if (META_RE.test(f.name)) {
      jsonFiles.push(f);
    } else {
      regularFiles.push(f);
    }
  }

  if (tarFiles.length === 0) {
    /* No archives — pass through directly (json pairs ride along) */
    return handleFiles(fileList, jsonFiles);
  }

  /* --- streaming, non-blocking archive loading --------------------------
     The index pass builds a lightweight list of entries (name/path/seq only)
     — no audio payload is retained. Cards are then materialized on demand:
     the first INITIAL_RENDER cards appear as soon as they are indexed, the
     rest wait for the scroll sentinel, and each card decodes on demand. */
  const archiveMeta = new Map();          /* key -> .json text (kept, small) */
  const notices = [];
  const STREAM_BATCH = 40;
  let queue = [];                         /* lightweight indexed items awaiting flush */

  const flushIndex = () => {
    if (!queue.length) return;
    const grouped = groupItems(queue);
    queue = [];
    for (const g of grouped) pendingCards.push(g);
    renderWindow(INITIAL_RENDER - renderedCards.length);
    updateSentinels();
  };

  const attachMetas = () => {
    let changed = false;
    for (const t of tracks) {
      if (t.meta) continue;
      const m = archiveMeta.get(metaKeyOf(t.name, t.filePath || null));
      if (m && m !== t.meta) { t.meta = m; changed = true; }
    }
    for (const d of pendingCards) {
      for (const it of d.items) {
        if (it.meta) continue;
        const m = archiveMeta.get(metaKeyOf(it.name, it.filePath || null));
        if (m) it.meta = m;
      }
    }
    if (changed) refreshAllMetaBodies();
  };

  let shown = 0;
  let lastProg = 0;
  for (const tf of tarFiles) {
    const isGz = GZ_RE.test(tf.name);
    if (isGz && typeof DecompressionStream === 'undefined') {
      notices.push('DecompressionStream not supported in this browser — skipped ' + tf.name);
      continue;
    }
    const fetcher = makeArchiveFetcher(tf, isGz);
    let resolveReady;
    const readyPromise = new Promise(res => { resolveReady = res; });

    const tr = createTarReader({
      onAudio: rec => {
        if (rec.bytes) fetcher.prewarm(rec.seq, rec.bytes);  /* warm the first entries */
        const handle = lazyAudioHandle(fetcher, rec.seq, rec.name, readyPromise);
        queue.push({
          name: rec.name, buffer: null, nativeSR: null, file: handle, filePath: rec.path,
          meta: archiveMeta.get(metaKeyOf(rec.name, rec.path)) || null
        });
        shown++;
      },
      onJson: j => {
        const k = metaKeyOf(j.name, j.path);
        archiveMeta.set(k, j.text);
        metaMap.set(k, j.text);
        metaSource.set(k, j.path);
      },
      captureAudio: seq => seq < ARCH_PREWARM
    });

    let src = tf.stream();
    if (isGz) src = src.pipeThrough(new DecompressionStream('gzip'));
    const reader = src.getReader();
    let streamError = null;
    try {
      for (;;) {
        let r;
        try { r = await reader.read(); }
        catch (e) { streamError = e; break; }
        if (r.done) break;
        tr.feed(r.value);
        /* Flush eagerly while the first cards haven't rendered yet (so the
           initial spectrograms appear after just a few entries), then settle
           into larger batches for grouping quality. */
        const flushThreshold = renderedCards.length < INITIAL_RENDER ? INITIAL_RENDER : STREAM_BATCH;
        if (queue.length >= flushThreshold) {
          flushIndex();
          const now = performance.now();
          if (now - lastProg > 120) {
            lastProg = now;
            streamProgSet('Indexed ' + shown + ' tracks…');
          }
        }
      }
    } finally {
      try { reader.releaseLock(); } catch (e) {}
    }
    flushIndex();
    resolveReady();            /* indexing pass done — allow on-demand decodes */

    const st = tr.finish();
    const truncated = st.truncated || !!streamError;
    if (truncated) {
      notices.push(shown
        ? 'Archive ' + tf.name + ' — loaded ' + shown + ' tracks, then truncated'
        : 'No audio recovered from ' + tf.name + ' (truncated/corrupt)');
    }
    streamProgSet('Loaded ' + shown + ' tracks from ' + tf.name);
    await new Promise(r => setTimeout(r, 30));
  }

  attachMetas();
  if (regularFiles.length) await handleFiles(regularFiles, jsonFiles);
  streamProgHide();
  if (notices.length) streamProgFlash(notices.join('  ·  '));
  updateSentinels();
  refreshUI();
}

/* ========================================================================
 *  FILE HANDLING
 *  When new files arrive, check against existing standalone tracks for
 *  stem matches. If found, merge into a diff group.
 * ======================================================================== */

/* Parse native sample rate from audio file headers */
function parseNativeSampleRate(arrayBuffer) {
  const view = new DataView(arrayBuffer);
  
  /* WAV: check for RIFF header */
  if (view.byteLength >= 28) {
    const riff = String.fromCharCode(view.getUint8(0), view.getUint8(1), view.getUint8(2), view.getUint8(3));
    const wave = String.fromCharCode(view.getUint8(8), view.getUint8(9), view.getUint8(10), view.getUint8(11));
    if (riff === 'RIFF' && wave === 'WAVE') {
      /* Sample rate is at offset 24 (little-endian uint32) */
      return view.getUint32(24, true);
    }
  }
  
  /* FLAC: check for fLaC header */
  if (view.byteLength >= 22) {
    const flac = String.fromCharCode(view.getUint8(0), view.getUint8(1), view.getUint8(2), view.getUint8(3));
    if (flac === 'fLaC') {
      /* STREAMINFO block: sample rate is in bits 80-99 (20 bits) */
      const byte10 = view.getUint8(18);
      const byte11 = view.getUint8(19);
      const byte12 = view.getUint8(20);
      return ((byte10 << 12) | (byte11 << 4) | (byte12 >> 4));
    }
  }
  
  /* For other formats (MP3, OGG, etc.), return null and fall back to decoded rate */
  return null;
}

/* ========================================================================
 *  PAIRED JSON METADATA
 *  A .json next to an audio file (same folder + basename) is matched up and
 *  shown in the right-hand "metadata" panel when enabled.
 * ======================================================================== */
function metaKeyOf(name, path) {
  let dir = '';
  if (path) {
    const parts = String(path).replace(/\\/g, '/').split('/');
    parts.pop();
    dir = parts.join('/');
  }
  return (dir ? dir.toLowerCase() + '/' : '') + String(name).replace(/\.[^.]+$/, '').toLowerCase();
}
function metaKeyOfFile(f) { return metaKeyOf(f.name, f._tarPath || null); }

/* Read .json files into the global metaMap (key → text). Oversized skipped. */
async function buildMetaMap(jsonList) {
  if (!jsonList || !jsonList.length) return metaMap;
  const dec = new TextDecoder('utf-8');
  await Promise.all(jsonList.map(async f => {
    let text = null;
    try {
      if (f.size > (4 << 20)) return;            /* too big to be metadata */
      text = dec.decode(await f.arrayBuffer());
    } catch (e) { console.error('Meta read error:', f.name, e); return; }
    const k = metaKeyOfFile(f);
    metaMap.set(k, text);
    metaSource.set(k, f._tarPath || f.name);
  }));
  invalidateFieldContent();
  return metaMap;
}

async function handleFiles(fileList, metaFiles) {
  const ext = /\.(mp3|wav|ogg|flac|m4a|aac|webm|wma|aiff|opus)$/i;

  /* Collect audio files only. Unknown extensions are sniffed by content
     (webdataset-style *.audio files etc.) — a 64-byte head read, no decode. */
  const audioFiles = [];
  for (const f of fileList) {
    if (f.type.startsWith('audio/') || ext.test(f.name)) { audioFiles.push(f); continue; }
    if (META_RE.test(f.name) || !f.size) continue;
    try {
      const head = new Uint8Array(await f.slice(0, SNIFF_LEN).arrayBuffer());
      if (sniffAudioMagic(head)) audioFiles.push(f);
    } catch (e) { console.error('Sniff error:', f.name, e); }
  }
  if (!audioFiles.length) return;

  const meta = await buildMetaMap(metaFiles);
  const attach = f => meta.get(metaKeyOfFile(f)) || null;

  const DECODE_CONCURRENCY = 6;
  const totalBytes = audioFiles.reduce((s, f) => s + (f.size || 0), 0);
  const fitsEager = audioFiles.every(f => (f.size || 0) <= EAGER_MAX_BYTES);
  if (audioFiles.length < LAZY_THRESH && fitsEager && totalBytes <= EAGER_TOTAL_MAX_BYTES) {
    /* ── EAGER PATH: decode in chunks of 6 to limit memory pressure ── */
    const batch = [];
    for (let i = 0; i < audioFiles.length; i += DECODE_CONCURRENCY) {
      const chunk = audioFiles.slice(i, i + DECODE_CONCURRENCY);
      const promises = chunk.map(f =>
        f.arrayBuffer().then(arrBuf => {
          const nativeSR = parseNativeSampleRate(arrBuf) || null;
        return decodeToAudioBuffer(arrBuf).then(decoded => ({
          name: f.name, buffer: decoded, nativeSR: nativeSR || decoded.sampleRate, filePath: f._tarPath || null,
          meta: attach(f)
        }));
        }).catch(e => { console.error('Decode error:', f.name, e); return null; })
      );
      const results = (await Promise.all(promises)).filter(Boolean);
      batch.push(...results);
    }
    if (!batch.length) return;
    /* Multichannel files are never grouped — render each as a standalone card. */
    const multiItems = batch.filter(it => it.buffer && it.buffer.numberOfChannels > 1);
    const rest = batch.filter(it => !(it.buffer && it.buffer.numberOfChannels > 1));
    for (const it of multiItems) {
      createStandalone(it.name, it.buffer, it.nativeSR, it.file, it.filePath, it.meta);
    }
    if (rest.length) applyGrouped(groupItems(rest));
    refreshUI();
  } else {
    /* ── LAZY PATH: windowed placeholder cards, decode on scroll ── */
    const items = audioFiles.map(f => ({ name: f.name, buffer: null, nativeSR: null, file: f, filePath: f._tarPath || null, meta: attach(f) }));
    const grouped = groupItems(items);
    for (const g of grouped) pendingCards.push(g);
    renderWindow(INITIAL_RENDER - renderedCards.length);
    updateSentinels();
    refreshUI();
  }
}

/* Apply grouped items: merge with existing tracks or create new cards.
   Items may have buffer=null (lazy) — createStandalone/createDiffGroup handle
   both. Returns the card element created/affected for each input descriptor
   (or null when an item was merged into an existing card). */
function applyGrouped(grouped) {
  const els = [];
  for (const grp of grouped) {
    let el = null;
    if (grp.items.length >= 2) {
      const existingMatch = findExistingStandaloneByStem(grp.baseName);
      let ph = null;
      if (existingMatch) {
        const oldTrack = existingMatch;
        const oldTag = extractTag(stripExt(oldTrack.name)).tag || oldTrack.name;
        ph = insertPlaceholderBefore(oldTrack.el);
        removeTrackQuietly(oldTrack.id);
        grp.items.push({ name: oldTrack.name, buffer: oldTrack.buffer, file: oldTrack.file, suffix: oldTag, nativeSR: oldTrack.nativeSR, filePath: oldTrack.filePath, meta: oldTrack.meta || null });
      }
      el = createDiffGroup(grp.baseName, grp.items);
      if (ph) placeCardAtPosition(ph);
    } else {
      const newItem = grp.items[0];
      if (!autoGroup) { el = createStandalone(newItem.name, newItem.buffer, newItem.nativeSR, newItem.file, newItem.filePath, newItem.meta); els.push(el || null); continue; }
      const { stem, tag } = extractTag(stripExt(newItem.name));
      const existingMatch = findExistingStandaloneByStem(stem);

      if (existingMatch && tag) {
        const oldTrack = existingMatch;
        const oldTag = extractTag(stripExt(oldTrack.name)).tag || oldTrack.name;
        const ph = insertPlaceholderBefore(oldTrack.el);
        removeTrackQuietly(oldTrack.id);
        el = createDiffGroup(stem, [
          { name: oldTrack.name, buffer: oldTrack.buffer, file: oldTrack.file, suffix: oldTag, nativeSR: oldTrack.nativeSR, filePath: oldTrack.filePath, meta: oldTrack.meta || null },
          { ...newItem, suffix: tag }
        ]);
        placeCardAtPosition(ph);
      } else {
        const existingGroup = findExistingGroupByStem(stem);
        if (existingGroup && tag) {
          el = addToDiffGroup(existingGroup, { ...newItem, suffix: tag });
        } else {
          el = createStandalone(newItem.name, newItem.buffer, newItem.nativeSR, newItem.file, newItem.filePath, newItem.meta);
        }
      }
    }
    els.push(el || null);
  }
  return els;
}

/* Find a standalone track (not in any group) whose stem matches */
function findExistingStandaloneByStem(stem) {
  const key = stem.toLowerCase();
  for (const t of tracks) {
    if (t.groupId != null) continue;
    if (t.isMulti) continue;   /* multichannel tracks never join groups */
    const { stem: tStem } = extractTag(stripExt(t.name));
    if (tStem.toLowerCase() === key) return t;
  }
  return null;
}

/* Find an existing diff group whose baseName stem matches */
function findExistingGroupByStem(stem) {
  const key = stem.toLowerCase();
  for (const g of groups) {
    if (g.baseName.toLowerCase() === key) return g;
  }
  return null;
}

/* Position helpers: preserve card position when removing/recreating */
function insertPlaceholderBefore(el) {
  const ph = document.createElement('div');
  if (el && el.parentNode === tracksBox) tracksBox.insertBefore(ph, el);
  return ph;
}
function placeCardAtPosition(ph) {
  const newCard = tracksBox.lastElementChild;
  if (newCard && newCard !== ph && ph.parentNode) tracksBox.insertBefore(newCard, ph);
  ph.remove();
}

/* Remove a track without triggering full UI refresh */
function removeTrackQuietly(id) {
  const i = tracks.findIndex(t => t.id === id);
  if (i < 0) return;
  const t = tracks[i];
  if (t.playing) stopSource(t);
  unwatchPaint(t);
  if (t.el) t.el.remove();
  tracks.splice(i, 1);
  if (activeTrackId === id) activeTrackId = null;
}

/* Add a new item to an existing diff group */
function addToDiffGroup(grp, newItem) {
  /* Easiest: remove the group, recreate with all items + the new one */
  const existingItems = grp.trackIds.map(id => {
    const t = tracks.find(tr => tr.id === id);
    if (!t) return null;
    const tag = extractTag(stripExt(t.name)).tag;
    const suffix = tag || (t.filePath ? getParentFolderName(t.filePath) : t.name);
    return { name: t.name, buffer: t.buffer, file: t.file, suffix, nativeSR: t.nativeSR, filePath: t.filePath, meta: t.meta || null };
  }).filter(Boolean);

  const ph = insertPlaceholderBefore(grp.el);
  removeDiffGroupQuietly(grp.id);
  existingItems.push(newItem);
  const el = createDiffGroup(grp.baseName, existingItems);
  placeCardAtPosition(ph);
  return el;
}

function removeDiffGroupQuietly(gid) {
  const gi = groups.findIndex(g => g.id === gid);
  if (gi < 0) return;
  const grp = groups[gi];
  for (const tid of grp.trackIds) {
    const ti = tracks.findIndex(t => t.id === tid);
    if (ti >= 0) {
      const t = tracks[ti];
      if (t.playing) stopSource(t);
      unwatchPaint(t);
      tracks.splice(ti, 1);
    }
  }
  grp.el.remove();
  groups.splice(gi, 1);
  if (activeTrackId && !tracks.find(t => t.id === activeTrackId)) activeTrackId = null;
}

/* ========================================================================
 *  STEM GROUPING — detects prefix OR suffix tags
 *
 *  Suffix: song_orig.wav, song_pred.wav         → stem "song"
 *  Prefix: orig_song.wav, pred_song.wav         → stem "song"
 *  Also supports '-' separator: song-orig.wav
 *  Tags are matched from KNOWN_TAGS (longest first).
 * ======================================================================== */
function stripExt(n) { return n.replace(/\.[^.]+$/, ''); }

/* KNOWN_TAGS sorted longest-first, computed once ('ground_truth' beats 'gt'). */
const KNOWN_TAGS_SORTED = KNOWN_TAGS.slice().sort((a,b) => b.length - a.length);

function extractTag(noExt) {
  const low = noExt.toLowerCase();

  for (const tag of KNOWN_TAGS_SORTED) {
    /* suffix: stem_tag  or  stem-tag */
    const sufPat1 = '_' + tag;
    const sufPat2 = '-' + tag;
    if (low.endsWith(sufPat1)) {
      return { stem: noExt.slice(0, -sufPat1.length), tag: noExt.slice(-tag.length), mode: 'suffix' };
    }
    if (low.endsWith(sufPat2)) {
      return { stem: noExt.slice(0, -sufPat2.length), tag: noExt.slice(-tag.length), mode: 'suffix' };
    }

    /* prefix: tag_stem  or  tag-stem */
    const prePat1 = tag + '_';
    const prePat2 = tag + '-';
    if (low.startsWith(prePat1)) {
      return { stem: noExt.slice(prePat1.length), tag: noExt.slice(0, tag.length), mode: 'prefix' };
    }
    if (low.startsWith(prePat2)) {
      return { stem: noExt.slice(prePat2.length), tag: noExt.slice(0, tag.length), mode: 'prefix' };
    }
  }

  return { stem: noExt, tag: '', mode: 'none' };
}

function groupByBaseName(items) {
  const m = new Map(); /* stemKey → { baseName, items[] } */
  for (const it of items) {
    const { stem, tag } = extractTag(stripExt(it.name));
    const key = stem.toLowerCase();
    if (!m.has(key)) m.set(key, { baseName: stem, items: [] });
    m.get(key).items.push({ ...it, suffix: tag });
  }
  const out = [];
  for (const [, val] of m) {
    /* only group if 2+ items with distinct tags */
    const uniq = new Set(val.items.map(i => i.suffix.toLowerCase()));
    if (val.items.length >= 2 && uniq.size >= 2) { out.push(val); continue; }
    /* otherwise standalone */
    for (const it of val.items) out.push({ baseName: it.name, items: [it] });
  }
  return out;
}

/* ========================================================================
 *  SPECTROGRAM — computeSpec (one-time STFT) + drawSpec (fast redraw)
 *
 *  The FFT core is an in-place radix-2 DIT using precomputed bit-reversal
 *  and twiddle tables. Because the input is real and only magnitudes are
 *  shown, the STFT packs TWO windowed frames into ONE complex FFT and
 *  recovers both spectra via symmetry — roughly halving the number of
 *  transforms. Bin levels are converted to dB in the power domain with an
 *  exponent/mantissa approximation (no Math.log10 per bin).
 * ======================================================================== */
const MIN_VIEW_SPAN = 0.05;
const ZOOM_FACTOR = 1.25;

/* Precomputed Hann window (FFT_SIZE is fixed at startup) */
const HANN_WIN = new Float32Array(FFT_SIZE);
for (let i = 0; i < FFT_SIZE; i++) HANN_WIN[i] = 0.5 * (1 - Math.cos(2 * Math.PI * i / (FFT_SIZE - 1)));

/* Precomputed FFT tables + shared scratch arrays. computeSpec is fully
   synchronous (never re-entered), so module-scope buffers are reused
   across frames and tracks to avoid per-call allocation. */
const FFT_REV   = new Uint16Array(FFT_SIZE);
const FFT_ROOTS = new Float64Array(FFT_SIZE * 2);   /* exp(-2πi·k/N) */
(function() {
  for (let i = 1, j = 0; i < FFT_SIZE; i++) {
    let b = FFT_SIZE >> 1;
    for (; j & b; b >>= 1) j ^= b;
    j ^= b;
    FFT_REV[i] = j;
  }
  for (let k = 0; k < FFT_SIZE; k++) {
    const a = -2 * Math.PI * k / FFT_SIZE;

  addFreqLabels(specRow.querySelector('.freq-labels'), track.nyquist);
  const loading = specRow.querySelector('.loading-overlay');

  attachLaneInteractions(track, track.canvas, track.wrapper, track.waveformWrapper);

  if (track.loaded) {
    /* Loaded track: schedule spectrogram render after DOM insertion */
    track._pendingRender = () => {
      const w = track.wrapper.clientWidth;
      if (w > 0) {
        track.canvas.width = w;
        if (track.waveformCanvas) track.waveformCanvas.width = w;
        setTimeout(() => {
          ensureSpec(track).then(() => {
            if (!isTrackAlive(track)) return;
            paintTrackCanvas(track);
            if (loading.parentNode) loading.remove();
          }).catch(() => {
            if (loading.parentNode) loading.remove();
          });
        }, 0);
      } else {
        if (loading.parentNode) loading.remove();
      }
    };
  } else {
    /* Lazy track: show dark placeholder — IntersectionObserver will trigger decode */
    loading.innerHTML = '<span style="color:#666;font-size:11px">Waiting to load…</span>';
    track._pendingRender = null;
  }
  return el;
}

/* Bind seek / zoom / selection-drag to one lane's canvas. All lanes share the
   track's time axis (viewStart/viewEnd); only the geometry differs per lane. */
function attachLaneInteractions(track, canvas, wrapper, waveWrapper) {
  if (!canvas) return;
  const seekHandler = e => {
    if (wrapper._wasDrag) { wrapper._wasDrag = false; return; }
    const rect = canvas.getBoundingClientRect();
    const cx = e.clientX - rect.left;
    const ratio = Math.max(0, Math.min(1, cx / rect.width));
    const time = track.viewStart + ratio * (track.viewEnd - track.viewStart);
    selectAndSeek(track, time);
  };
  wrapper.addEventListener('click', seekHandler);
  waveWrapper.addEventListener('click', seekHandler);

  const wheelHandler = e => {
    if (e.ctrlKey || e.metaKey) {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const mouseX = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      const factor = e.deltaY > 0 ? ZOOM_FACTOR : 1 / ZOOM_FACTOR;
      applyZoom(track, mouseX, factor);
    } else {
      const span = track.viewEnd - track.viewStart;
      if (span >= track.duration - 0.001) return;
      e.preventDefault();
      applyPan(track, (e.deltaY / 500) * span);
    }
  };
  wrapper.addEventListener('wheel', wheelHandler, { passive: false });
  waveWrapper.addEventListener('wheel', wheelHandler, { passive: false });

  let dragStartX = null, selBox = null;
  const onDragMove = e => {
    if (dragStartX === null || !selBox) return;
    const rect = canvas.getBoundingClientRect();
    const left = Math.max(0, Math.min(dragStartX, e.clientX) - rect.left);
    const right = Math.min(rect.width, Math.max(dragStartX, e.clientX) - rect.left);
    selBox.style.left = left + 'px'; selBox.style.width = (right - left) + 'px';
  };
  const onDragUp = e => {
    document.removeEventListener('mousemove', onDragMove);
    document.removeEventListener('mouseup', onDragUp);
    if (dragStartX === null) return;
    const rect = canvas.getBoundingClientRect();
    const x1 = Math.max(0, (Math.min(dragStartX, e.clientX) - rect.left) / rect.width);
    const x2 = Math.min(1, (Math.max(dragStartX, e.clientX) - rect.left) / rect.width);
    if (selBox) selBox.remove(); selBox = null; dragStartX = null;
    if (x2 - x1 < 0.01) return;
    wrapper._wasDrag = true;
    const span = track.viewEnd - track.viewStart;
    const ns = track.viewStart + x1 * span, ne = track.viewStart + x2 * span;
    setTrackView(track, ns, ne); syncGroupZoom(track); redrawTrack(track); updateRuler(track);
    if (track.groupId != null) { const sibs = getSiblings(track); for (const s of sibs) { if (s.id !== track.id) { redrawTrack(s); updateRuler(s); } } }
    updatePlayheads();
  };
  wrapper.addEventListener('mousedown', e => {
    if (e.shiftKey) {
      e.preventDefault(); e.stopPropagation();
      dragStartX = e.clientX;
      selBox = document.createElement('div');
      selBox.className = 'zoom-selection'; selBox.style.height = '100%';
      wrapper.appendChild(selBox);
      document.addEventListener('mousemove', onDragMove);
      document.addEventListener('mouseup', onDragUp);
    }
  });
}

/* Multichannel body — one channel lane (label + waveform + spectrogram) per
   channel, sharing the track's time axis/ruler. One analysis strip at the end. */
function buildMultiChannelBody(track, h) {
  const el = document.createElement('div');
  el.className = 'track-body';
  el.style.flexDirection = 'column';

  const loadings = [];
  const chH = channelSpecHeight(track.chViews.length);

  for (let i = 0; i < track.chViews.length; i++) {
    const ch = track.chViews[i];
    const laneEl = document.createElement('div');
    laneEl.className = 'ch-lane';

    /* Channel label row */
    const lblRow = document.createElement('div');
    lblRow.className = 'ch-label';
    lblRow.innerHTML =
      '<span class="ch-tag">Ch' + (i + 1) + '</span>' +
      '<span class="ch-name">' + esc(channelName(i)) + '</span>' +
      '<button class="ch-mute" title="Mute this channel">Mute</button>' +
      '<span class="ch-spacer"></span>';
    const muteBtn = lblRow.querySelector('.ch-mute');
    track.muteBtn[i] = muteBtn;
    lblRow.querySelector('.ch-name').addEventListener('click', e => { e.stopPropagation(); selectChannel(track, i); });
    muteBtn.addEventListener('click', e => {
      e.stopPropagation();
      selectChannel(track, i);
      if (track.mutedCh.has(i)) track.mutedCh.delete(i); else track.mutedCh.add(i);
      updateChannelListenUI(track);
      applyChannelListen(track);
    });
    laneEl.appendChild(lblRow);
    ch.labelEl = lblRow;

    /* Waveform row */
    const wfH = getWaveformHeight(chH);
    const waveRow = document.createElement('div');
    waveRow.className = 'waveform-row';
    waveRow.style.height = wfH + 'px';
    waveRow.style.display = waveformVisible ? 'flex' : 'none';
    waveRow.innerHTML =
      '<div class="waveform-labels" style="height:' + wfH + 'px"></div>' +
      '<div class="waveform-wrapper" style="flex:1;position:relative;overflow:hidden;cursor:crosshair">' +
      '<canvas height="' + wfH + '"></canvas>' +
      '<div style="position:absolute;top:0;left:0;width:2px;height:100%;background:#ff3333;pointer-events:none;z-index:10" class="wf-playhead"></div>' +
      '</div>';
    laneEl.appendChild(waveRow);
    ch.waveformRow = waveRow;
    ch.waveformWrapper = waveRow.querySelector('.waveform-wrapper');
    ch.waveformCanvas = waveRow.querySelector('canvas');
    ch.waveformPh = waveRow.querySelector('.wf-playhead');
    ch.waveformCanvas._h = wfH;
    addWaveformLabels(waveRow.querySelector('.waveform-labels'), wfH);

    /* Spectrogram row */
    const specRow = document.createElement('div');
    specRow.style.cssText = 'display:flex;flex:1;min-height:0';
    specRow.innerHTML =
      '<div class="freq-labels" style="height:' + chH + 'px"></div>' +
      '<div class="spec-wrapper" style="height:' + chH + 'px">' +
      '<canvas height="' + chH + '"></canvas>' +
      '<div class="playhead" style="left:0"></div>' +
      '<div class="loading-overlay"><div class="spinner"></div>Rendering...</div>' +
      '</div>';
    laneEl.appendChild(specRow);

    el.appendChild(laneEl);

    ch.canvas = specRow.querySelector('canvas');
    ch.wrapper = specRow.querySelector('.spec-wrapper');
    ch.ph = specRow.querySelector('.playhead');
    ch.canvas._h = chH;
    addFreqLabels(specRow.querySelector('.freq-labels'), track.nyquist);
    const loading = specRow.querySelector('.loading-overlay');

    attachLaneInteractions(track, ch.canvas, ch.wrapper, ch.waveformWrapper);
    loadings.push(loading);
  }

  const strip = document.createElement('div');
  strip.className = 'analysis-strip empty';
  strip.style.paddingLeft = '44px';
  el.appendChild(strip);
  track.analysisStrip = strip;

  /* Aggregate pending render over all channel lanes. */
  if (track.loaded) {
    track._pendingRender = () => {
      const first = track.chViews[0];
      const w = first && first.wrapper ? first.wrapper.clientWidth : 0;
      if (w > 0) {
        for (const ch of track.chViews) {
          if (ch.canvas) ch.canvas.width = w;
          if (ch.waveformCanvas) ch.waveformCanvas.width = w;
        }
        setTimeout(() => {
          if (!isTrackAlive(track)) { for (const ld of loadings) if (ld.parentNode) ld.remove(); return; }
          for (let i = 0; i < track.chViews.length; i++) renderSpec(track, i);
          if (waveformVisible) for (let i = 0; i < track.chViews.length; i++) drawWaveform(track, i);
          for (const ld of loadings) if (ld.parentNode) ld.remove();
        }, 0);
      } else {
        for (const ld of loadings) if (ld.parentNode) ld.remove();
      }
    };
  } else {
    for (const ld of loadings) ld.innerHTML = '<span style="color:#666;font-size:11px">Waiting to load…</span>';
    track._pendingRender = null;
  }

  updateChannelListenUI(track);
  return el;
}

function updateChannelListenUI(t) {
  const n = t.buffer ? t.buffer.numberOfChannels : 0;
  for (let c = 0; c < n; c++) {
    const mute = t.muteBtn[c];
    if (mute) mute.classList.toggle('on', t.mutedCh.has(c));
  }
}
function updateChannelActiveUI(t) {
  for (let c = 0; c < t.chViews.length; c++) {
    const el = t.chViews[c].labelEl;
    if (el) el.classList.toggle('selected', t.activeCh === c);
  }
}
function selectChannel(t, c) { t.activeCh = c; updateChannelActiveUI(t); }

/* Rebuild a decoded lazy card's body into per-channel lanes in place (header /
   ruler preserved). */
function rebuildBodyAsMulti(track) {
  const card = track.el;
  if (!card) return;
  const old = card.querySelector('.card-left .track-body') || card.querySelector('.track-body');
  const ruler = card.querySelector('.card-left .time-ruler') || card.querySelector('.time-ruler');
  track.isMulti = true;
  ensureChannelViews(track, expandChannelCount(track));
  const body = buildMultiChannelBody(track, SPEC_H);
  if (old && old.parentNode) {
    const parent = old.parentNode;
    if (ruler && ruler.parentNode === parent) parent.insertBefore(body, ruler);
    else if (old.nextSibling) parent.insertBefore(body, old.nextSibling);
    else parent.appendChild(body);
    old.remove();
  } else if (ruler && ruler.parentNode) {
    ruler.parentNode.insertBefore(body, ruler);
  } else {
    card.appendChild(body);
  }
  scheduleGeometry();
}

/* A now-multichannel member is never allowed to stay in a diff group: split the
   group into standalone cards in place and return true. */
function splitMultiOutOfGroup(track) {
  const g = groups.find(gr => gr.id === track.groupId);
  if (!g) return false;
  const rec = renderedCards.find(d => d._el === g.el);
  const placeholder = document.createElement('div');
  if (g.el && g.el.parentNode === tracksBox) tracksBox.insertBefore(placeholder, g.el);
  const gid = g.id;
  const members = g.trackIds.map(id => tracks.find(x => x.id === id)).filter(x => x && x.id !== track.id);
  removeDiffGroupQuietly(gid);
  const newEls = [];
  const newDescs = [];
  for (const m of members) {
    const el = createStandalone(m.name, m.buffer || null, m.nativeSR, m.file, m.filePath, m.meta || null);
    newEls.push(el);
    newDescs.push({ baseName: m.name, items: [{ name: m.name, buffer: m.buffer || null, nativeSR: m.nativeSR, file: m.file, filePath: m.filePath, meta: m.meta || null }], _el: el });
  }
  const selfEl = createStandalone(track.name, track.buffer || null, track.nativeSR, track.file, track.filePath, track.meta || null);
  newEls.push(selfEl);
  newDescs.push({ baseName: track.name, items: [{ name: track.name, buffer: track.buffer || null, nativeSR: track.nativeSR, file: track.file, filePath: track.filePath, meta: track.meta || null }], _el: selfEl });
  for (const el of newEls) if (el && placeholder.parentNode) tracksBox.insertBefore(el, placeholder);
  placeholder.remove();
  if (rec) {
    const i = renderedCards.indexOf(rec);
    if (i >= 0) renderedCards.splice(i, 1, ...newDescs);
  }
  fixActiveTrack();
  refreshUI();
  const self = tracks.find(x => x.el === selfEl);
  if (self && self.isMulti && self.loaded && self._pendingRender) { self._pendingRender(); self._pendingRender = null; }
  return true;
}

function niceStep(rawStep) {
  const nice = [0.01, 0.02, 0.05, 0.1, 0.2, 0.5, 1, 2, 5, 10, 15, 30, 60, 120, 300, 600];
  for (const n of nice) { if (n >= rawStep * 0.8) return n; }
  return rawStep;
}
function populateRuler(el, viewStart, viewEnd) {
  el.innerHTML = '';
  const viewSpan = viewEnd - viewStart;
  if (viewSpan <= 0) return;
  const step = niceStep(viewSpan / 10);
  const firstTick = Math.ceil(viewStart / step) * step;
  for (let t = firstTick; t <= viewEnd + 0.001; t += step) {
    const pct = ((t - viewStart) / viewSpan) * 100;
    if (pct < -1 || pct > 101) continue;
    const m = document.createElement('span');
    m.className = 'time-mark'; m.textContent = fmtShort(t);
    m.style.left = pct + '%';
    el.appendChild(m);
  }
}
function buildRuler(track) {
  const el = document.createElement('div');
  el.className = 'time-ruler';
  track.rulerEl = el;
  populateRuler(el, track.viewStart, track.viewEnd);
  return el;
}
function updateRuler(track) {
  if (!track.rulerEl) return;
  populateRuler(track.rulerEl, track.viewStart, track.viewEnd);
}

/* ========================================================================
 *  PAIRED JSON — right-hand metadata panel
 * ======================================================================== */
const META_SHOW_MAX = 120000;   /* cap displayed JSON length (chars) */
/* Cap tree-rendered DOM lines per metadata panel (large arrays would create
   100k+ nodes and freeze the panel render). */
const META_TREE_MAX_LINES = 4000;

function escMetaText(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
/* escMetaText for use inside double-quoted HTML attributes */
function escAttr(s) { return escMetaText(s).replace(/"/g, '&quot;'); }

/* Minimal, dependency-free JSON syntax highlighter → HTML (no escaping bugs:
   raw characters inside strings are emitted as-is but HTML-escaped). */
function highlightJson(text) {
  const out = [];
  let i = 0;
  const n = text.length;
  const isNumChar = c => (c >= '0' && c <= '9') || c === '-' || c === '+' || c === '.' || c === 'e' || c === 'E';
  while (i < n) {
    const ch = text[i];
    if (ch === ' ' || ch === '\t' || ch === '\n' || ch === '\r') { out.push(ch); i++; continue; }
    if (ch === '"') {
      let j = i + 1;
      while (j < n) {
        if (text[j] === '\\') { j += 2; continue; }
        if (text[j] === '"') { j++; break; }
        j++;
      }
      const lit = text.slice(i, j);
      let k = j;
      while (k < n && (text[k] === ' ' || text[k] === '\t')) k++;
      const isKey = text[k] === ':';
      const cls = isKey ? 'jv-key' : 'jv-str';
      out.push('<span class="' + cls + '">' + escMetaText(lit) + '</span>');
      i = j;
      continue;
    }
    if (isNumChar(ch)) {
      let j = i;
      while (j < n && isNumChar(text[j])) j++;
      out.push('<span class="jv-num">' + escMetaText(text.slice(i, j)) + '</span>');
      i = j;
      continue;
    }
    if (/[A-Za-z]/.test(ch)) {
      let j = i;
      while (j < n && /[A-Za-z]/.test(text[j])) j++;
      const word = text.slice(i, j);
      const cls = word === 'true' || word === 'false' ? 'jv-bool' : (word === 'null' ? 'jv-null' : 'jv-punc');
      out.push('<span class="' + cls + '">' + word + '</span>');
      i = j;
      continue;
    }
    if ('{}[],:'.indexOf(ch) >= 0) { out.push('<span class="jv-punc">' + ch + '</span>'); i++; continue; }
    out.push(escMetaText(ch)); i++;
  }
  return out.join('');
}

/* Pretty-print + highlight a raw json string. Returns HTML (or error markup). */
function renderJsonMeta(raw) {
  if (!raw) return '<span class="meta-empty">No JSON</span>';
  let text, pretty;
  try {
    const parsed = JSON.parse(raw);
    pretty = (parsed !== null && typeof parsed === 'object')
      ? JSON.stringify(parsed, null, 2)
      : String(raw);
  } catch (e) {
    return '<div class="meta-err">' + escMetaText('Invalid JSON — ' + (e && e.message ? e.message : e)) + '</div>' +
           '<pre class="meta-raw">' + escMetaText(raw) + '</pre>';
  }
  const truncated = pretty.length > META_SHOW_MAX;
  if (truncated) text = pretty.slice(0, META_SHOW_MAX);
  else text = pretty;
  let html = highlightJson(text);
  if (truncated) {
    html += '<div class="meta-trunc">… truncated (' + pretty.length.toLocaleString() + ' chars) — metadata only</div>';
  }
  return html;
}

/* Build the DOM for a card's right-hand metadata panel. */
function buildMetaPanel() {
  const aside = document.createElement('div');
  aside.className = 'meta-aside';
  const head = document.createElement('div');
  head.className = 'meta-head';
  head.innerHTML =
    '<button class="meta-pill" title="Browse all fields across loaded files">fields</button>' +
    '<span class="meta-head-lbl">JSON metadata</span>' +
    '<button class="meta-clear" title="Clear field selection (show full JSON)">&times;</button>';
  head.querySelector('.meta-clear').addEventListener('click', clearMetaSel);
  head.querySelector('.meta-pill').addEventListener('click', e => {
    e.stopPropagation();
    toggleMetaPop(e.currentTarget);
  });
  const body = document.createElement('div');
  body.className = 'meta-body';
  aside.appendChild(head);
  aside.appendChild(body);
